name: Syntex 0.16.7 Setup Process Shutdown V2

on:
  push:
    branches: ['fix/0.16.7-setup-process-shutdown-v2']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.6/SyntexLauncher-0.16.6-win-x64.zip
      BASE_SHA: f34397dae9ca7986ef5d8f9183c6d4ee355126d2c9b913dea6eee561835ada74
      BASE_SIZE: 69903997
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Prepare immutable 0.16.6 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $work=Join-Path $env:RUNNER_TEMP 'setup-process-shutdown-v2'
          $candidate=Join-Path $work 'candidate'
          $runningRoot=Join-Path $work 'running-root'
          $dist=Join-Path $work 'dist'
          $base=Join-Path $work 'base.zip'
          New-Item -ItemType Directory -Force $work,$candidate,$runningRoot,$dist|Out-Null
          Invoke-WebRequest $env:BASE_URL -OutFile $base -UseBasicParsing
          if((Get-Item $base).Length -ne [int64]$env:BASE_SIZE){throw '0.16.6 baseline size changed'}
          $sha=(Get-FileHash $base -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne $env:BASE_SHA){throw "0.16.6 baseline hash changed: $sha"}
          Expand-Archive $base $candidate -Force
          Expand-Archive $base $runningRoot -Force
          "WORK=$work"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CANDIDATE=$candidate"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RUNNING_ROOT=$runningRoot"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DIST=$dist"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BASE_ZIP=$base"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'IMMUTABLE_0166_BASELINE_PASS'

      - name: Patch managed startup onto Avalonia UI dispatcher
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $patchDir=Join-Path $env:RUNNER_TEMP 'managed-startup-patcher-v3'
          New-Item -ItemType Directory -Force $patchDir|Out-Null
          Copy-Item .\rc-src\PatchManagedStartup.cs (Join-Path $patchDir 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Mono.Cecil" Version="0.11.6" />
            </ItemGroup>
          </Project>
          '@|Set-Content (Join-Path $patchDir 'Patcher.csproj') -Encoding utf8
          $output=dotnet run --project (Join-Path $patchDir 'Patcher.csproj') -c Release -- (Join-Path $env:CANDIDATE 'app')
          $output|Write-Host
          if($LASTEXITCODE-ne0){throw "Managed startup patch failed: $LASTEXITCODE"}
          if(($output -join "`n") -notmatch 'PATCH_OK_AVALONIA_DISPATCHER:'){throw 'Avalonia dispatcher patch marker missing'}
          Write-Host 'AVALONIA_DISPATCHER_MANAGED_PATCH_PASS'

      - name: Locate Visual C++ x64 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=&$vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if([string]::IsNullOrWhiteSpace($vs)){throw 'VC++ x64 tools missing'}
          "VSDEVCMD=$(Join-Path $vs 'Common7\Tools\VsDevCmd.bat')"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build 0.16.7 native host and update agent
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Join-Path $env:RUNNER_TEMP 'build-native-v2.cmd'
          @(
            '@echo on',
            "call `"$env:VSDEVCMD`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            "cl.exe /nologo /DNOMINMAX /utf-8 /std:c++20 /EHsc /W4 /O1 /Os /GL /MT `"$env:GITHUB_WORKSPACE\rc-src\LauncherHost.cpp`" /Fe:`"$env:CANDIDATE\SyntexLauncher.exe`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF winhttp.lib bcrypt.lib shell32.lib user32.lib",
            'if errorlevel 1 exit /b %errorlevel%',
            "cl.exe /nologo /DNOMINMAX /utf-8 /std:c++20 /EHsc /W4 /O1 /Os /GL /MT `"$env:GITHUB_WORKSPACE\rc-src\UpdateAgent.cpp`" /Fe:`"$env:CANDIDATE\app\SyntexUpdateAgent.exe`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF shell32.lib user32.lib",
            'exit /b %errorlevel%'
          )|Set-Content $cmd -Encoding ascii
          &cmd.exe /d /c $cmd
          if($LASTEXITCODE-ne0){throw "Native build failed: $LASTEXITCODE"}
          Write-Host 'NATIVE_0167_X64_BUILD_PASS'

      - name: Require visible window ten consecutive times
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $launcherHost=Join-Path $env:CANDIDATE 'SyntexLauncher.exe'
          for($i=1;$i-le10;$i++){
            $p=Start-Process $launcherHost -ArgumentList '--ci-gui-self-test' -WorkingDirectory $env:CANDIDATE -PassThru
            if(-not $p.WaitForExit(60000)){
              try{$p.Kill($true)}catch{}
              throw "Visible-window repetition $i timed out"
            }
            if($p.ExitCode-ne0){
              Get-ChildItem (Join-Path $env:CANDIDATE 'storage\logs\launcher-startup') -File -ErrorAction SilentlyContinue|ForEach-Object{Get-Content $_.FullName -Raw|Write-Host}
              throw "Visible-window repetition $i failed: $($p.ExitCode)"
            }
            Write-Host "VISIBLE_WINDOW_REPEAT_${i}_PASS"
          }
          Write-Host 'TEN_CONSECUTIVE_VISIBLE_STARTS_PASS'

      - name: Package fresh candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:DIST 'SyntexLauncher-0.16.7-avalonia-dispatcher-ci-win-x64.zip'
          Push-Location $env:CANDIDATE
          try{&7z a -tzip -mx=9 -mfb=258 -mpass=15 -y $zip '.\*'|Out-Host}finally{Pop-Location}
          if($LASTEXITCODE-ne0){throw "7z failed: $LASTEXITCODE"}
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $zip).Length
          "CANDIDATE_ZIP=$zip"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CANDIDATE_SHA=$hash"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CANDIDATE_SIZE=$size"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "FRESH_CANDIDATE_SHA=$hash"
          Write-Host "FRESH_CANDIDATE_SIZE=$size"

      - name: Patch and build x64 Setup candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/Patch-SetupProcessShutdown.ps1 -SetupSource ./rc-src/Setup.cpp
          @('#pragma once',("static constexpr wchar_t PAYLOAD_URL[] = L`"https://ci.invalid/syntex-0.16.7.zip`";"),("static constexpr wchar_t PAYLOAD_SHA256[] = L`"{0}`";" -f $env:CANDIDATE_SHA),("static constexpr unsigned long long PAYLOAD_SIZE = {0}ULL;" -f $env:CANDIDATE_SIZE))|Set-Content ./rc-src/PayloadContract.h -Encoding utf8
          $out=Join-Path $env:DIST 'SyntexSetup-0.16.7-x64-AVALONIA-DISPATCHER-TEST.exe'
          $cmd=Join-Path $env:RUNNER_TEMP 'build-setup-avalonia-dispatcher.cmd'
          @(
            '@echo on',
            "call `"$env:VSDEVCMD`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            "cl.exe /nologo /DNOMINMAX /utf-8 /std:c++20 /EHsc /W4 /O2 /MT /I`"$env:GITHUB_WORKSPACE\rc-src`" `"$env:GITHUB_WORKSPACE\rc-src\Setup.cpp`" /Fe:`"$out`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 winhttp.lib bcrypt.lib shell32.lib ole32.lib user32.lib gdi32.lib advapi32.lib comctl32.lib uxtheme.lib",
            'exit /b %errorlevel%'
          )|Set-Content $cmd -Encoding ascii
          &cmd.exe /d /c $cmd
          if($LASTEXITCODE-ne0){throw "Setup build failed: $LASTEXITCODE"}
          "FINAL_SETUP=$out"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Setup selftests and AMD64
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($arg in @('--self-test','--repair-self-test','--log-self-test')){
            $p=Start-Process $env:FINAL_SETUP -ArgumentList $arg -PassThru -Wait
            if($p.ExitCode-ne0){throw "$arg failed: $($p.ExitCode)"}
          }
          $b=[IO.File]::ReadAllBytes($env:FINAL_SETUP)
          if($b[0]-ne0x4d-or$b[1]-ne0x5a){throw 'MZ missing'}
          $lf=[BitConverter]::ToInt32($b,0x3c)
          if([BitConverter]::ToUInt16($b,$lf+4)-ne0x8664){throw 'Setup is not AMD64'}
          Write-Host 'SETUP_AVALONIA_DISPATCHER_X64_SELFTEST_PASS'

      - name: Real open-launcher repair and visible restart
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:RUNNING_ROOT
          foreach($d in @('storage','data','instances','runtimes')){
            New-Item -ItemType Directory -Force (Join-Path $root $d)|Out-Null
            "KEEP-$d"|Set-Content (Join-Path $root "$d\keep.txt") -Encoding ascii
          }
          $old=Start-Process (Join-Path $root 'SyntexLauncher.exe') -WorkingDirectory $root -PassThru
          Start-Sleep -Seconds 3
          if($old.HasExited){throw "Old launcher exited too early: $($old.ExitCode)"}
          $oldPid=$old.Id
          $setup=Start-Process $env:FINAL_SETUP -ArgumentList @('--ci-install-local',"`"$root`"","`"$env:CANDIDATE_ZIP`"") -PassThru
          if(-not $setup.WaitForExit(180000)){
            try{$setup.Kill($true)}catch{}
            Get-Process SyntexLauncher -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
            throw 'Integrated Setup repair exceeded 180 seconds'
          }
          if($setup.ExitCode-ne0){
            Get-ChildItem (Join-Path $root 'storage\logs') -Recurse -File -ErrorAction SilentlyContinue|ForEach-Object{Write-Host "--- $($_.FullName) ---";Get-Content $_.FullName -Raw|Write-Host}
            throw "Integrated Setup repair failed: $($setup.ExitCode)"
          }
          if(Get-Process -Id $oldPid -ErrorAction SilentlyContinue){throw 'Pre-existing launcher survived Setup repair'}
          foreach($d in @('storage','data','instances','runtimes')){
            if((Get-Content (Join-Path $root "$d\keep.txt") -Raw).Trim()-ne"KEEP-$d"){throw "Setup changed $d"}
          }
          $logs=Join-Path $root 'storage\logs\launcher-startup'
          $text=(Get-ChildItem $logs -File|ForEach-Object{Get-Content $_.FullName -Raw})-join"`n"
          if($text-notmatch'Startprüfung erfolgreich: sichtbares Launcher-Fenster erkannt'){throw 'Visible restart marker missing'}
          Write-Host 'INTEGRATED_OPEN_LAUNCHER_REPAIR_VISIBLE_RESTART_PASS'

      - name: Repeat repair three times while 0.16.7 is running
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:RUNNING_ROOT
          for($i=1;$i-le3;$i++){
            $before=(Get-ChildItem (Join-Path $root 'storage\logs\launcher-startup') -File).Count
            $setup=Start-Process $env:FINAL_SETUP -ArgumentList @('--ci-install-local',"`"$root`"","`"$env:CANDIDATE_ZIP`"") -PassThru
            if(-not $setup.WaitForExit(180000)){
              try{$setup.Kill($true)}catch{}
              throw "Repeated running-launcher repair $i exceeded 180 seconds"
            }
            if($setup.ExitCode-ne0){
              Get-ChildItem (Join-Path $root 'storage\logs') -Recurse -File -ErrorAction SilentlyContinue|ForEach-Object{Write-Host "--- $($_.FullName) ---";Get-Content $_.FullName -Raw|Write-Host}
              throw "Repeated running-launcher repair $i failed: $($setup.ExitCode)"
            }
            $after=(Get-ChildItem (Join-Path $root 'storage\logs\launcher-startup') -File).Count
            if($after-le$before){throw "Repeated repair $i produced no new startup health log"}
            foreach($d in @('storage','data','instances','runtimes')){
              if((Get-Content (Join-Path $root "$d\keep.txt") -Raw).Trim()-ne"KEEP-$d"){throw "Repeated repair $i changed $d"}
            }
            Write-Host "REPEATED_RUNNING_0167_REPAIR_${i}_PASS"
          }
          Get-Process SyntexLauncher -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'THREE_REPEATED_RUNNING_0167_REPAIRS_PASS'

      - name: Upload verified test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Syntex-0.16.7-avalonia-dispatcher-setup-test
          path: |
            ${{ env.FINAL_SETUP }}
            ${{ env.CANDIDATE_ZIP }}
          if-no-files-found: error
          retention-days: 7
