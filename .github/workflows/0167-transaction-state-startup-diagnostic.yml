name: Syntex 0.16.7 Transaction State Startup Diagnostic

on:
  push:
    branches: ['fix/0.16.7-setup-process-shutdown-v2']
    paths:
      - '.github/workflows/0167-transaction-state-startup-diagnostic.yml'
      - 'rc-src/PatchManagedStartup.cs'
      - 'rc-src/LauncherHost.cpp'
      - 'rc-src/UpdateAgent.cpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.6/SyntexLauncher-0.16.6-win-x64.zip
      BASE_SHA: f34397dae9ca7986ef5d8f9183c6d4ee355126d2c9b913dea6eee561835ada74
      BASE_SIZE: '69903997'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Prepare baseline roots
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $work=Join-Path $env:RUNNER_TEMP 'transaction-state-diagnostic'
          $zip=Join-Path $work 'base.zip'
          $candidate=Join-Path $work 'candidate'
          $repairRoot=Join-Path $work 'repair-root'
          New-Item -ItemType Directory -Force $work,$candidate,$repairRoot|Out-Null
          Invoke-WebRequest $env:BASE_URL -OutFile $zip -UseBasicParsing
          if((Get-Item $zip).Length-ne[int64]$env:BASE_SIZE){throw 'baseline size changed'}
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()-ne$env:BASE_SHA){throw 'baseline hash changed'}
          Expand-Archive $zip $candidate -Force
          Expand-Archive $zip $repairRoot -Force
          "CANDIDATE=$candidate"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "REPAIR_ROOT=$repairRoot"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'TRANSACTION_DIAG_BASELINE_PASS'

      - name: Patch managed startup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $patchDir=Join-Path $env:RUNNER_TEMP 'patcher'
          New-Item -ItemType Directory -Force $patchDir|Out-Null
          Copy-Item .\rc-src\PatchManagedStartup.cs (Join-Path $patchDir 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup><PackageReference Include="Mono.Cecil" Version="0.11.6" /></ItemGroup>
          </Project>
          '@|Set-Content (Join-Path $patchDir 'Patcher.csproj') -Encoding utf8
          $o=dotnet run --project (Join-Path $patchDir 'Patcher.csproj') -c Release -- (Join-Path $env:CANDIDATE 'app')
          $o|Write-Host
          if($LASTEXITCODE-ne0-or($o-join"`n")-notmatch'PATCH_OK_AVALONIA_DISPATCHER:'){throw 'managed patch failed'}

      - name: Build new native host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=&$vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if([string]::IsNullOrWhiteSpace($vs)){throw 'VC tools missing'}
          $dev=Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $cmd=Join-Path $env:RUNNER_TEMP 'build-diag.cmd'
          @('@echo on',"call `"$dev`" -arch=x64 -host_arch=x64",'if errorlevel 1 exit /b %errorlevel%',"cl.exe /nologo /DNOMINMAX /utf-8 /std:c++20 /EHsc /W4 /O1 /Os /GL /MT `"$env:GITHUB_WORKSPACE\rc-src\LauncherHost.cpp`" /Fe:`"$env:CANDIDATE\SyntexLauncher.exe`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF winhttp.lib bcrypt.lib shell32.lib user32.lib",'exit /b %errorlevel%')|Set-Content $cmd -Encoding ascii
          &cmd.exe /d /c $cmd
          if($LASTEXITCODE-ne0){throw 'host build failed'}
          Write-Host 'TRANSACTION_DIAG_NEW_HOST_PASS'

      - name: Direct clean candidate control starts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          for($i=1;$i-le3;$i++){
            $p=Start-Process (Join-Path $env:CANDIDATE 'SyntexLauncher.exe') -ArgumentList '--ci-gui-self-test' -WorkingDirectory $env:CANDIDATE -PassThru
            if(-not$p.WaitForExit(60000)){try{$p.Kill($true)}catch{};throw "clean control $i timeout"}
            if($p.ExitCode-ne0){throw "clean control $i exit $($p.ExitCode)"}
          }
          Write-Host 'TRANSACTION_DIAG_CLEAN_3X_PASS'

      - name: Recreate exact prepared repair filesystem state
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:REPAIR_ROOT
          foreach($d in @('storage','data','instances','runtimes')){
            New-Item -ItemType Directory -Force (Join-Path $root $d)|Out-Null
            "KEEP-$d"|Set-Content (Join-Path $root "$d\keep.txt") -Encoding ascii
          }
          $preserved=@('storage','data','instances','runtimes','cache','downloads','logs','creator','diagnostics','temp','updates','fehleranalysen','saves','screenshots','resourcepacks','shaderpacks','config','profiles','accounts','backups')
          $backup=Join-Path $root '.syntex-repair-backup'
          New-Item -ItemType Directory -Force $backup|Out-Null
          Get-ChildItem $root -Force|Where-Object{$_.Name-ne'.syntex-repair-backup'-and$preserved-notcontains$_.Name.ToLowerInvariant()}|ForEach-Object{Move-Item $_.FullName (Join-Path $backup $_.Name)}
          Get-ChildItem $env:CANDIDATE -Force|Where-Object{$preserved-notcontains$_.Name.ToLowerInvariant()}|ForEach-Object{Copy-Item $_.FullName (Join-Path $root $_.Name) -Recurse -Force}
          if(-not(Test-Path (Join-Path $backup 'SyntexLauncher.exe'))){throw 'old host backup missing'}
          if(-not(Test-Path (Join-Path $root 'SyntexLauncher.exe'))){throw 'new host missing'}
          foreach($d in @('storage','data','instances','runtimes')){if((Get-Content (Join-Path $root "$d\keep.txt") -Raw).Trim()-ne"KEEP-$d"){throw "$d changed during prepared-state simulation"}}
          Write-Host 'TRANSACTION_PREPARED_STATE_RECREATED_PASS'

      - name: Start five times with repair backup still present
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:REPAIR_ROOT
          for($i=1;$i-le5;$i++){
            $p=Start-Process (Join-Path $root 'SyntexLauncher.exe') -ArgumentList '--ci-gui-self-test' -WorkingDirectory $root -PassThru
            if(-not$p.WaitForExit(60000)){try{$p.Kill($true)}catch{};throw "prepared-state start $i timeout"}
            if($p.ExitCode-ne0){
              Get-ChildItem (Join-Path $root 'storage\logs\launcher-startup') -File -ErrorAction SilentlyContinue|ForEach-Object{Write-Host "---$($_.Name)---";Get-Content $_.FullName -Raw|Write-Host}
              throw "prepared-state start $i exit $($p.ExitCode)"
            }
            Write-Host "TRANSACTION_PREPARED_VISIBLE_START_${i}_PASS"
          }
          Write-Host 'TRANSACTION_PREPARED_VISIBLE_START_5X_PASS'
