name: Syntex 0.16.7 Setup Process Fix V4

on:
  push:
    branches: ['fix/0.16.7-setup-process-healthcheck']
    paths:
      - 'scripts/Patch-SetupProcessShutdown.ps1'
      - '.github/workflows/0167-setup-process-healthcheck-fix-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GOOD_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.7-ci-34467708548/SyntexLauncher-0.16.7-ci-win-x64.zip
      GOOD_SHA: cc716db79bc5eb8cae80413aa2fe5cce519e05e3c2b12b9e11ae943c1780207f
      GOOD_SIZE: 70090490
      BASE_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.6/SyntexLauncher-0.16.6-win-x64.zip
      BASE_SHA: f34397dae9ca7986ef5d8f9183c6d4ee355126d2c9b913dea6eee561835ada74
      BASE_SIZE: 69903997

    steps:
      - uses: actions/checkout@v4

      - name: Patch Setup source
        shell: pwsh
        run: ./scripts/Patch-SetupProcessShutdown.ps1 -SetupSource ./rc-src/Setup.cpp

      - name: Verify immutable payloads
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $work=Join-Path $env:RUNNER_TEMP 'setup-process-v4'
          $dist=Join-Path $work 'dist'
          New-Item -ItemType Directory -Force $work,$dist|Out-Null
          function Get-Verified($url,$sha,$size,$name){
            $p=Join-Path $work $name
            Invoke-WebRequest $url -OutFile $p -UseBasicParsing
            if((Get-Item $p).Length -ne [int64]$size){throw "$name size mismatch"}
            if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha){throw "$name hash mismatch"}
            return $p
          }
          $base=Get-Verified $env:BASE_URL $env:BASE_SHA $env:BASE_SIZE 'base.zip'
          $null=Get-Verified $env:GOOD_URL $env:GOOD_SHA $env:GOOD_SIZE 'good.zip'
          "WORK=$work"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DIST=$dist"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BASE_ZIP=$base"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build x64 setup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @('#pragma once',("static constexpr wchar_t PAYLOAD_URL[] = L`"{0}`";" -f $env:GOOD_URL),("static constexpr wchar_t PAYLOAD_SHA256[] = L`"{0}`";" -f $env:GOOD_SHA),("static constexpr unsigned long long PAYLOAD_SIZE = {0}ULL;" -f $env:GOOD_SIZE))|Set-Content ./rc-src/PayloadContract.h -Encoding utf8
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=&$vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if([string]::IsNullOrWhiteSpace($vs)){throw 'VC++ x64 missing'}
          $dev=Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $out=Join-Path $env:DIST 'SyntexSetup-0.16.7-x64-PROCESS-FIX-V4.exe'
          $cmd=Join-Path $env:RUNNER_TEMP 'build-v4.cmd'
          @('@echo on',"call `"$dev`" -arch=x64 -host_arch=x64",'if errorlevel 1 exit /b %errorlevel%',"cl.exe /nologo /DNOMINMAX /utf-8 /std:c++20 /EHsc /W4 /O2 /MT /I`"$env:GITHUB_WORKSPACE\rc-src`" `"$env:GITHUB_WORKSPACE\rc-src\Setup.cpp`" /Fe:`"$out`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 winhttp.lib bcrypt.lib shell32.lib ole32.lib user32.lib gdi32.lib advapi32.lib comctl32.lib uxtheme.lib",'exit /b %errorlevel%')|Set-Content $cmd -Encoding ascii
          &cmd.exe /d /c $cmd
          if($LASTEXITCODE-ne0){throw 'Setup build failed'}
          "FINAL_SETUP=$out"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Selftests and x64
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($arg in @('--self-test','--repair-self-test','--log-self-test')){
            $p=Start-Process $env:FINAL_SETUP -ArgumentList $arg -PassThru -Wait
            if($p.ExitCode-ne0){throw "$arg failed $($p.ExitCode)"}
          }
          $b=[IO.File]::ReadAllBytes($env:FINAL_SETUP)
          $lf=[BitConverter]::ToInt32($b,0x3c)
          if($b[0]-ne0x4d -or $b[1]-ne0x5a -or [BitConverter]::ToUInt16($b,$lf+4)-ne0x8664){throw 'Setup not AMD64 PE'}
          Write-Host 'SETUP_V4_X64_SELFTEST_PASS'

      - name: Real repair closes running launcher and starts new launcher
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:WORK 'running-root'
          Expand-Archive $env:BASE_ZIP $root -Force
          foreach($d in @('storage','data','instances','runtimes')){
            New-Item -ItemType Directory -Force (Join-Path $root $d)|Out-Null
            "KEEP-$d"|Set-Content (Join-Path $root "$d\keep.txt") -Encoding ascii
          }
          $old=Start-Process (Join-Path $root 'SyntexLauncher.exe') -WorkingDirectory $root -PassThru
          Start-Sleep -Seconds 3
          if($old.HasExited){throw "old launcher exited too early $($old.ExitCode)"}
          $oldPid=$old.Id
          Write-Host "OLD_PID=$oldPid"
          $setup=Start-Process $env:FINAL_SETUP -ArgumentList @('--ci-install',"`"$root`"") -PassThru -Wait
          if($setup.ExitCode-ne0){
            Get-ChildItem (Join-Path $root 'storage\logs') -Recurse -File -ErrorAction SilentlyContinue|ForEach-Object{Write-Host "---$($_.FullName)---";Get-Content $_.FullName -Raw|Write-Host}
            throw "setup exit $($setup.ExitCode)"
          }
          if(Get-Process -Id $oldPid -ErrorAction SilentlyContinue){throw 'old host survived setup'}
          foreach($d in @('storage','data','instances','runtimes')){
            if((Get-Content (Join-Path $root "$d\keep.txt") -Raw).Trim() -ne "KEEP-$d"){throw "changed $d"}
          }
          $startup=Join-Path $root 'storage\logs\launcher-startup'
          $latest=Get-ChildItem $startup -File|Sort-Object LastWriteTimeUtc -Descending|Select-Object -First 1
          $text=Get-Content $latest.FullName -Raw
          Write-Host $text
          if(-not $text.Contains('Startprüfung erfolgreich: sichtbares Launcher-Fenster erkannt.')){throw 'visible launcher marker missing'}
          Get-Process SyntexLauncher -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'SETUP_RUNNING_LAUNCHER_AUTO_CLOSE_VISIBLE_START_PASS'

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: SyntexSetup-0.16.7-x64-process-fix-v4
          path: ${{ env.FINAL_SETUP }}
          if-no-files-found: error
          retention-days: 7
