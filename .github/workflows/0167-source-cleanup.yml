name: Syntex 0.16.7 Source Cleanup

on:
  push:
    branches: ['feat/0.16.7-self-update']
    paths:
      - '.github/workflows/0167-source-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/0.16.7-self-update
          fetch-depth: 0
      - name: Remove CI-only deletion of successfully verified install target
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='rc-src/Setup.cpp'
          $src=Get-Content $path -Raw
          $old="        std::error_code ec;`n        fs::remove_all(target, ec);`n        return 0;"
          if(-not $src.Contains($old)){
            $old="        std::error_code ec;`r`n        fs::remove_all(target, ec);`r`n        return 0;"
          }
          if(-not $src.Contains($old)){throw 'Expected CI cleanup block not found.'}
          $src=$src.Replace($old,'        return 0;')
          Set-Content $path $src -Encoding utf8 -NoNewline
          if((Get-Content $path -Raw).Contains('fs::remove_all(target, ec);')){throw 'Target cleanup still present.'}
      - name: Commit source cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rc-src/Setup.cpp
          git diff --cached --quiet && { echo 'No source change'; exit 1; }
          git commit -m 'Keep verified CI install target for post-install assertions'
          git push origin HEAD:feat/0.16.7-self-update
