name: Build Syntex 0.16.6 Final v4

on:
  push:
    paths:
      - '.github/workflows/build-0166-final-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-publish:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare verified compact payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'syntex-0166-final-v4'
          $old = Join-Path $work 'old'
          $payload = Join-Path $work 'payload'
          New-Item -ItemType Directory -Force -Path $old,$payload,(Join-Path $payload 'app') | Out-Null
          $baseZip = Join-Path $work 'base-0.16.5.zip'
          Invoke-WebRequest -Uri 'https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.5/SyntexLauncher-0.16.5-win-x64.zip' -OutFile $baseZip -UseBasicParsing
          $hash = (Get-FileHash $baseZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'a219a352bdbdc19ad0464de77214fadb6fc219e1a883fee8dfa88e3ba5078570') { throw "Base payload hash mismatch: $hash" }
          Expand-Archive -LiteralPath $baseZip -DestinationPath $old -Force
          Get-ChildItem -LiteralPath $old -Force | ForEach-Object { Move-Item -LiteralPath $_.FullName -Destination (Join-Path $payload 'app') -Force }
          Get-ChildItem -LiteralPath (Join-Path $payload 'app') -Recurse -Filter '*.pdb' -File | Remove-Item -Force
          if (-not (Test-Path (Join-Path $payload 'app\SyntexLauncher.exe'))) { throw 'Managed apphost missing.' }
          if (-not (Test-Path (Join-Path $payload 'app\SyntexLauncher.dll'))) { throw 'SyntexLauncher.dll missing.' }
          Copy-Item (Join-Path $payload 'app\SyntexLauncher.exe') (Join-Path $payload 'app\SyntexLauncher.App.exe') -Force
          "WORK=$work" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PAYLOAD=$payload" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Patch managed startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patchRoot = Join-Path $env:RUNNER_TEMP 'syntex-ilpatch-v4'
          New-Item -ItemType Directory -Force -Path $patchRoot | Out-Null
          Push-Location $patchRoot
          try {
            dotnet new console --framework net10.0 --force | Out-Null
            dotnet add package Mono.Cecil --version 0.11.5 | Out-Null
            Copy-Item "$env:GITHUB_WORKSPACE\rc-src\PatchManagedStartup.cs" '.\Program.cs' -Force
            dotnet run -c Release -- (Join-Path $env:PAYLOAD 'app\SyntexLauncher.dll')
            if ($LASTEXITCODE -ne 0) { throw "Managed startup patch failed: $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Build native x64 host and uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vs)) { throw 'Visual C++ x64 tools not found.' }
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $cmd = Join-Path $env:RUNNER_TEMP 'build-native-v4.cmd'
          @(
            '@echo on',
            "call `"$dev`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            "cl.exe /nologo /utf-8 /std:c++20 /EHsc /W4 /O1 /Os /GL /MT `"$env:GITHUB_WORKSPACE\rc-src\LauncherHost.cpp`" /Fe:`"$env:PAYLOAD\SyntexLauncher.exe`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF shell32.lib user32.lib",
            'if errorlevel 1 exit /b %errorlevel%',
            "cl.exe /nologo /utf-8 /std:c++20 /EHsc /W4 /O1 /Os /GL /MT `"$env:GITHUB_WORKSPACE\rc-src\Uninstaller.cpp`" /Fe:`"$env:PAYLOAD\app\SyntexUninstall.exe`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF shell32.lib user32.lib advapi32.lib ole32.lib",
            'exit /b %errorlevel%'
          ) | Set-Content -LiteralPath $cmd -Encoding ascii
          & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Native build failed: $LASTEXITCODE" }
          "VSDEVCMD=$dev" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify clean root and real managed GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem $env:PAYLOAD -File)
          $dirs = @(Get-ChildItem $env:PAYLOAD -Directory)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'SyntexLauncher.exe') { throw "Unexpected root files: $($files.Name -join ', ')" }
          if ($dirs.Count -ne 1 -or $dirs[0].Name -ne 'app') { throw "Unexpected root dirs: $($dirs.Name -join ', ')" }
          $logTest = Start-Process (Join-Path $env:PAYLOAD 'SyntexLauncher.exe') -ArgumentList '--host-log-self-test' -PassThru -Wait
          if ($logTest.ExitCode -ne 0) { throw "Host log self-test failed: $($logTest.ExitCode)" }
          $gui = Start-Process (Join-Path $env:PAYLOAD 'SyntexLauncher.exe') -ArgumentList '--ci-gui-self-test' -PassThru -Wait
          if ($gui.ExitCode -ne 0) {
            Get-ChildItem (Join-Path $env:PAYLOAD 'storage\logs\launcher-startup') -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -Raw }
            $fatal = Join-Path $env:PAYLOAD 'app\diagnostics\bootstrap-fatal.log'
            if (Test-Path $fatal) { Write-Host '--- bootstrap-fatal.log ---'; Get-Content $fatal -Raw }
            throw "Real managed GUI startup failed: $($gui.ExitCode)"
          }
          Write-Host 'REAL_MANAGED_GUI_STARTUP_PASS'
          Remove-Item (Join-Path $env:PAYLOAD 'storage') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Compress payload and build small Setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:WORK 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $zip = Join-Path $dist 'SyntexLauncher-0.16.6-win-x64.zip'
          Push-Location $env:PAYLOAD
          try { & 7z a -tzip -mx=9 -mfb=258 -mpass=15 -y $zip '.\*' | Out-Host } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw "7z failed: $LASTEXITCODE" }
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipSize = (Get-Item $zip).Length
          @"
          #pragma once
          #define PAYLOAD_URL L"https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.6/SyntexLauncher-0.16.6-win-x64.zip"
          #define PAYLOAD_SHA256 L"$zipHash"
          #define PAYLOAD_SIZE $($zipSize)ULL
          "@ | Set-Content "$env:GITHUB_WORKSPACE\rc-src\PayloadContract.h" -Encoding utf8
          $src = (Get-Content "$env:GITHUB_WORKSPACE\rc-src\Setup.cpp" -Raw).Replace('0.16.6 RC1','0.16.6').Replace('0.16.6-RC1','0.16.6')
          $finalSrc = Join-Path $env:RUNNER_TEMP 'Setup-0.16.6-v4.cpp'
          Set-Content $finalSrc $src -Encoding utf8
          $setup = Join-Path $dist 'SyntexLauncherSetup-0.16.6-win-x64.exe'
          $cmd = Join-Path $env:RUNNER_TEMP 'build-setup-v4.cmd'
          @(
            '@echo on',
            "call `"$env:VSDEVCMD`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            "cl.exe /nologo /utf-8 /std:c++20 /EHsc /W4 /O1 /Os /GL /MT /I`"$env:GITHUB_WORKSPACE\rc-src`" `"$finalSrc`" /Fe:`"$setup`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF winhttp.lib bcrypt.lib shell32.lib ole32.lib user32.lib gdi32.lib advapi32.lib comctl32.lib uxtheme.lib",
            'exit /b %errorlevel%'
          ) | Set-Content $cmd -Encoding ascii
          & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Setup build failed: $LASTEXITCODE" }
          if ((Get-Item $setup).Length -gt 5MB) { throw "Setup too large: $((Get-Item $setup).Length)" }
          "ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIP_HASH=$zipHash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIP_SIZE=$zipSize" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SETUP=$setup" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup self-tests and GUI smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($arg in @('--self-test','--log-self-test','--repair-self-test')) {
            $p = Start-Process $env:SETUP -ArgumentList $arg -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "Setup self-test $arg failed: $($p.ExitCode)" }
          }
          $p = Start-Process $env:SETUP -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do { Start-Sleep -Milliseconds 100; $p.Refresh(); if ($p.HasExited) { throw "Setup exited before GUI: $($p.ExitCode)" } }
            while ($p.MainWindowHandle -eq [IntPtr]::Zero -and [DateTime]::UtcNow -lt $deadline)
            if ($p.MainWindowHandle -eq [IntPtr]::Zero) { throw 'Setup GUI not detected.' }
          } finally { if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } }
          Write-Host 'SETUP_SELFTESTS_AND_GUI_PASS'

      - name: Publish v0.16.6 as prerelease for public E2E
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v0.16.6 *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete v0.16.6 --cleanup-tag -y }
          gh release create v0.16.6 $env:ZIP $env:SETUP --prerelease --title 'Syntex Launcher 0.16.6' --notes 'Windows x64 repair release.'
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed: $LASTEXITCODE" }

      - name: Full public download install and managed-GUI E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Sleep -Seconds 5
          $target = Join-Path $env:RUNNER_TEMP 'Syntex-0166-v4-E2E'
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          $p = Start-Process $env:SETUP -ArgumentList @('--ci-install',$target) -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            $setupLogs = Join-Path (Split-Path $env:SETUP -Parent) 'SyntexSetup-Log'
            if (Test-Path $setupLogs) { Get-ChildItem $setupLogs -File | ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -Raw } }
            $startLogs = Join-Path $target 'storage\logs\launcher-startup'
            if (Test-Path $startLogs) { Get-ChildItem $startLogs -File | ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -Raw } }
            throw "FULL PUBLIC E2E FAILED: $($p.ExitCode)"
          }
          Write-Host 'FULL_PUBLIC_DOWNLOAD_INSTALL_MANAGED_GUI_PASS'

      - name: Promote verified release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release edit v0.16.6 --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release promotion failed: $LASTEXITCODE" }
          $setupHash = (Get-FileHash $env:SETUP -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSize = (Get-Item $env:SETUP).Length
          @"
          version=0.16.6
          setup_size=$setupSize
          setup_sha256=$setupHash
          payload_size=$env:ZIP_SIZE
          payload_sha256=$env:ZIP_HASH
          "@ | Set-Content (Join-Path $env:WORK 'dist\SHA256SUMS.txt') -Encoding ascii
          Write-Host "FINAL_SETUP_SIZE=$setupSize"
          Write-Host "FINAL_SETUP_SHA256=$setupHash"

      - uses: actions/upload-artifact@v4
        with:
          name: SyntexLauncherSetup-0.16.6-win-x64
          path: |
            ${{ env.SETUP }}
            ${{ env.WORK }}\dist\SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
