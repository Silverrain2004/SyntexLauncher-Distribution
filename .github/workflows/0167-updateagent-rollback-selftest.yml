name: Syntex 0.16.7 Update Agent Rollback Selftest

on:
  push:
    branches: ['feat/0.16.7-self-update']
    paths:
      - 'rc-src/UpdateAgent.cpp'
      - '.github/workflows/0167-updateagent-rollback-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback-selftest:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Locate Visual Studio x64 compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe missing on Windows runner.' }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vs)) { throw 'Visual C++ x64 toolchain not found.' }
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $dev)) { throw 'VsDevCmd.bat missing.' }
          "VSDEVCMD=$dev" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Update Agent and deterministic old/failing hosts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'syntex-updateagent-rollback'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          @'
          #define UNICODE
          #define _UNICODE
          #include <windows.h>
          int WINAPI wWinMain(HINSTANCE,HINSTANCE,PWSTR,int) { return 0; }
          '@ | Set-Content (Join-Path $work 'OldHost.cpp') -Encoding utf8
          @'
          #define UNICODE
          #define _UNICODE
          #include <windows.h>
          int WINAPI wWinMain(HINSTANCE,HINSTANCE,PWSTR,int) { return 42; }
          '@ | Set-Content (Join-Path $work 'FailHost.cpp') -Encoding utf8
          $cmd = Join-Path $work 'build.cmd'
          @(
            '@echo on',
            "call `"$env:VSDEVCMD`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            "cl.exe /nologo /utf-8 /std:c++20 /EHsc /W4 /O2 /MT `"$env:GITHUB_WORKSPACE\rc-src\UpdateAgent.cpp`" /Fe:`"$work\SyntexUpdateAgent.exe`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 shell32.lib",
            'if errorlevel 1 exit /b %errorlevel%',
            "cl.exe /nologo /utf-8 /std:c++20 /EHsc /W4 /O2 /MT `"$work\OldHost.cpp`" /Fe:`"$work\OldHost.exe`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64",
            'if errorlevel 1 exit /b %errorlevel%',
            "cl.exe /nologo /utf-8 /std:c++20 /EHsc /W4 /O2 /MT `"$work\FailHost.cpp`" /Fe:`"$work\FailHost.exe`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64",
            'exit /b %errorlevel%'
          ) | Set-Content $cmd -Encoding ascii
          & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Native rollback fixtures failed to compile: $LASTEXITCODE" }
          "WORK=$work" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Force failed healthcheck and prove automatic rollback plus user-data preservation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:WORK 'installed'
          $stage = Join-Path $env:WORK 'stage'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'app') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'data') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'instances\world-a') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'runtimes\java-21') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'app') | Out-Null

          Copy-Item (Join-Path $env:WORK 'OldHost.exe') (Join-Path $root 'SyntexLauncher.exe')
          Copy-Item (Join-Path $env:WORK 'OldHost.exe') (Join-Path $root 'app\SyntexLauncher.exe')
          Copy-Item (Join-Path $env:WORK 'OldHost.exe') (Join-Path $root 'app\SyntexUninstall.exe')
          'OLD-APP-SENTINEL' | Set-Content (Join-Path $root 'app\old-program.txt') -Encoding ascii
          'KEEP-DATA' | Set-Content (Join-Path $root 'data\user-data.txt') -Encoding ascii
          'KEEP-WORLD' | Set-Content (Join-Path $root 'instances\world-a\level.dat') -Encoding ascii
          'KEEP-RUNTIME' | Set-Content (Join-Path $root 'runtimes\java-21\release') -Encoding ascii

          Copy-Item (Join-Path $env:WORK 'FailHost.exe') (Join-Path $stage 'SyntexLauncher.exe')
          Copy-Item (Join-Path $env:WORK 'FailHost.exe') (Join-Path $stage 'app\SyntexLauncher.exe')
          Copy-Item (Join-Path $env:WORK 'FailHost.exe') (Join-Path $stage 'app\SyntexUninstall.exe')
          Copy-Item (Join-Path $env:WORK 'SyntexUpdateAgent.exe') (Join-Path $stage 'app\SyntexUpdateAgent.exe')
          'NEW-APP-SENTINEL' | Set-Content (Join-Path $stage 'app\new-program.txt') -Encoding ascii

          $oldHostHash = (Get-FileHash (Join-Path $root 'SyntexLauncher.exe') -Algorithm SHA256).Hash
          $oldAppHash = (Get-FileHash (Join-Path $root 'app\SyntexLauncher.exe') -Algorithm SHA256).Hash
          $agent = Join-Path $env:WORK 'SyntexUpdateAgent.exe'
          $p = Start-Process -FilePath $agent -ArgumentList @('--root',$root,'--stage',$stage,'--parent-pid','0','--from-version','0.16.6','--to-version','0.16.7') -PassThru -Wait
          if ($p.ExitCode -ne 205) { throw "Expected forced healthcheck rollback exit 205, got $($p.ExitCode)." }

          if ((Get-FileHash (Join-Path $root 'SyntexLauncher.exe') -Algorithm SHA256).Hash -ne $oldHostHash) { throw 'Rollback did not restore old root host.' }
          if ((Get-FileHash (Join-Path $root 'app\SyntexLauncher.exe') -Algorithm SHA256).Hash -ne $oldAppHash) { throw 'Rollback did not restore old managed launcher.' }
          if ((Get-Content (Join-Path $root 'app\old-program.txt') -Raw).Trim() -ne 'OLD-APP-SENTINEL') { throw 'Rollback did not restore old app content.' }
          if (Test-Path (Join-Path $root 'app\new-program.txt')) { throw 'Failed staged app content survived rollback.' }
          if ((Get-Content (Join-Path $root 'data\user-data.txt') -Raw).Trim() -ne 'KEEP-DATA') { throw 'Rollback modified data user content.' }
          if ((Get-Content (Join-Path $root 'instances\world-a\level.dat') -Raw).Trim() -ne 'KEEP-WORLD') { throw 'Rollback modified instance/world data.' }
          if ((Get-Content (Join-Path $root 'runtimes\java-21\release') -Raw).Trim() -ne 'KEEP-RUNTIME') { throw 'Rollback modified managed runtime data.' }

          $logs = @(Get-ChildItem (Join-Path $root 'storage\logs\launcher-update') -Filter 'SyntexUpdate-*.log' -File -ErrorAction Stop)
          if ($logs.Count -lt 1) { throw 'Rollback failure did not produce an update log.' }
          $logText = ($logs | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | Get-Content -Raw)
          if ($logText -notmatch 'UPDATE_HEALTHCHECK_FAILED' -or $logText -notmatch 'Rollback: erfolgreich') { throw "Rollback log did not confirm successful automatic restore.`n$logText" }
          Write-Host 'UPDATE_AGENT_FORCED_HEALTHCHECK_ROLLBACK_PASS'
          Write-Host 'USER_DATA_INSTANCES_RUNTIMES_PRESERVED_PASS'
