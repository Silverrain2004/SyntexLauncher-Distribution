name: Public Distribution Smoke

on:
  push:
    paths:
      - 'distribution.json'
      - '.github/workflows/distribution-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64-public-distribution:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest and immutable release payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content "$env:GITHUB_WORKSPACE\distribution.json" -Raw | ConvertFrom-Json
          if ($manifest.product -ne 'Syntex Launcher') { throw 'Unexpected product in manifest.' }
          if ($manifest.channel -ne 'stable') { throw 'Unexpected release channel.' }
          if ($manifest.version -ne '0.16.6') { throw "Unexpected version: $($manifest.version)" }
          if ($manifest.runtimeIdentifier -ne 'win-x64') { throw 'Unexpected runtime identifier.' }
          if ($manifest.minimumWindowsBuild -ne 17763) { throw 'Unexpected minimum Windows build.' }
          if (-not ([string]$manifest.payload.url).StartsWith('https://')) { throw 'Payload URL is not HTTPS.' }
          if ($manifest.payload.sha256 -ne 'f34397dae9ca7986ef5d8f9183c6d4ee355126d2c9b913dea6eee561835ada74') { throw 'Unexpected payload SHA-256 in manifest.' }
          if ([int64]$manifest.payload.size -ne 69903997) { throw 'Unexpected payload size in manifest.' }

          $payload = Join-Path $env:RUNNER_TEMP 'SyntexLauncher-0.16.6-win-x64.zip'
          Invoke-WebRequest -Uri $manifest.payload.url -OutFile $payload -UseBasicParsing
          if ((Get-Item $payload).Length -ne [int64]$manifest.payload.size) { throw 'Downloaded payload size does not match manifest.' }
          $payloadHash = (Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($payloadHash -ne $manifest.payload.sha256) { throw "Downloaded payload SHA-256 mismatch: $payloadHash" }
          Write-Host "PUBLIC PAYLOAD PASS · $((Get-Item $payload).Length) bytes · SHA256 $payloadHash"

      - name: Validate immutable public setup asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setupUrl = 'https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.6/SyntexLauncherSetup-0.16.6-win-x64.exe'
          $setup = Join-Path $env:RUNNER_TEMP 'SyntexLauncherSetup-0.16.6-win-x64.exe'
          Invoke-WebRequest -Uri $setupUrl -OutFile $setup -UseBasicParsing
          if ((Get-Item $setup).Length -ne 331776) { throw "Unexpected public setup size: $((Get-Item $setup).Length)" }
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($setupHash -ne '7d785b1b4205ccb9bc59ab630bebd93a9853ba8f4bbf491f8315091e12241c17') { throw "Public setup SHA-256 mismatch: $setupHash" }
          $bytes = [IO.File]::ReadAllBytes($setup)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Public setup is not a PE executable.' }
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x8664) { throw ("Expected AMD64 PE machine 0x8664, got 0x{0:X4}" -f $machine) }
          Write-Host "PUBLIC SETUP ASSET PASS · 331776 bytes · x64 · SHA256 $setupHash"
