name: Syntex 0.16.7 Final Candidate Continuation

on:
  workflow_dispatch:
  push:
    branches: ['feat/0.16.7-self-update']
    paths:
      - '.github/workflows/0167-final-candidate-continuation.yml'

permissions:
  contents: read

jobs:
  windows-final-continuation:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GOOD_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.7-ci-34464842635/SyntexLauncher-0.16.7-ci-win-x64.zip
      GOOD_SHA: dc1121cda940ab551868e55d6c1fafe5f98178d35683b753ca156d2fd38fc3a5
      GOOD_SIZE: 70090681
      BAD_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.7-ci-bad-34464842635/SyntexLauncher-0.16.7-ci-bad-win-x64.zip
      BAD_SHA: 01037a9c0186ed3544f6437b935e55141afb7135bd88f91044880fac881ddb9b
      BAD_SIZE: 70087569
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/0.16.7-self-update

      - name: Verify immutable candidate assets and prepare baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $work=Join-Path $env:RUNNER_TEMP 'syntex-final-continuation'
          $updateRoot=Join-Path $work 'update-root'
          $dist=Join-Path $work 'dist'
          New-Item -ItemType Directory -Force -Path $work,$updateRoot,$dist | Out-Null
          $good=Join-Path $work 'good.zip'; $bad=Join-Path $work 'bad.zip'; $base=Join-Path $work 'base.zip'
          Invoke-WebRequest $env:GOOD_URL -OutFile $good -UseBasicParsing
          Invoke-WebRequest $env:BAD_URL -OutFile $bad -UseBasicParsing
          if((Get-Item $good).Length -ne [int64]$env:GOOD_SIZE -or (Get-FileHash $good -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:GOOD_SHA){throw 'Immutable good candidate verification failed.'}
          if((Get-Item $bad).Length -ne [int64]$env:BAD_SIZE -or (Get-FileHash $bad -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:BAD_SHA){throw 'Immutable bad candidate verification failed.'}
          Invoke-WebRequest 'https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.6/SyntexLauncher-0.16.6-win-x64.zip' -OutFile $base -UseBasicParsing
          if((Get-Item $base).Length -ne 69903997 -or (Get-FileHash $base -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f34397dae9ca7986ef5d8f9183c6d4ee355126d2c9b913dea6eee561835ada74'){throw 'Immutable 0.16.6 baseline verification failed.'}
          Expand-Archive $base $updateRoot -Force
          $goodExtract=Join-Path $work 'good-extract'; Expand-Archive $good $goodExtract -Force
          "WORK=$work"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "UPDATE_ROOT=$updateRoot"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BASE=$base"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DIST=$dist"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GOOD_HOST_HASH=$((Get-FileHash (Join-Path $goodExtract 'SyntexLauncher.exe') -Algorithm SHA256).Hash.ToLowerInvariant())"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate Visual C++ x64 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if([string]::IsNullOrWhiteSpace($vs)){throw 'Visual C++ x64 tools not found.'}
          "VSDEVCMD=$(Join-Path $vs 'Common7\Tools\VsDevCmd.bat')"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build simulated 0.16.6 update host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Get-Content .\rc-src\LauncherHost.cpp -Raw
          $src=$src.Replace('static constexpr wchar_t kCurrentVersion[] = L"0.16.7";','static constexpr wchar_t kCurrentVersion[] = L"0.16.6";')
          $src=$src.Replace('https://raw.githubusercontent.com/Silverrain2004/SyntexLauncher-Distribution/main/distribution.json','https://raw.githubusercontent.com/Silverrain2004/SyntexLauncher-Distribution/feat/0.16.7-self-update/self-update-final-continuation.json')
          $oldSrc=Join-Path $env:RUNNER_TEMP 'LauncherHost-old.cpp'; Set-Content $oldSrc $src -Encoding utf8
          $cmd=Join-Path $env:RUNNER_TEMP 'build-old.cmd'
          @('@echo on',"call `"$env:VSDEVCMD`" -arch=x64 -host_arch=x64",'if errorlevel 1 exit /b %errorlevel%',"cl.exe /nologo /DNOMINMAX /utf-8 /std:c++20 /EHsc /W4 /O1 /Os /GL /MT `"$oldSrc`" /Fe:`"$env:UPDATE_ROOT\SyntexLauncher.exe`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF winhttp.lib bcrypt.lib shell32.lib user32.lib",'exit /b %errorlevel%')|Set-Content $cmd -Encoding ascii
          & cmd.exe /d /c $cmd; if($LASTEXITCODE -ne 0){throw 'Old host build failed.'}

      - name: Real self-update and preserved user data
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($d in @('storage','data','instances','runtimes')){New-Item -ItemType Directory -Force (Join-Path $env:UPDATE_ROOT $d)|Out-Null; "KEEP-$d"|Set-Content (Join-Path $env:UPDATE_ROOT "$d\keep.txt") -Encoding ascii}
          $p=Start-Process (Join-Path $env:UPDATE_ROOT 'SyntexLauncher.exe') -PassThru
          if(-not $p.WaitForExit(30000)){try{$p.Kill($true)}catch{};throw 'Original 0.16.6 host did not exit after updater handoff.'}
          if($p.ExitCode -ne 0){throw "0.16.6 host handoff failed: $($p.ExitCode)"}
          $deadline=[DateTime]::UtcNow.AddMinutes(3); $ok=$false
          do{Start-Sleep -Milliseconds 500; $dir=Join-Path $env:UPDATE_ROOT 'storage\logs\launcher-update'; if(Test-Path $dir){if(Get-ChildItem $dir -File -ErrorAction SilentlyContinue|Where-Object{(Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue)-match 'UPDATE_SUCCESS'}){$ok=$true;break}}}while([DateTime]::UtcNow -lt $deadline)
          if(-not $ok){Get-ChildItem (Join-Path $env:UPDATE_ROOT 'storage\logs') -Recurse -File -ErrorAction SilentlyContinue|ForEach-Object{Write-Host "---$($_.FullName)---";Get-Content $_.FullName -Raw};throw 'Self-update did not reach UPDATE_SUCCESS.'}
          if((Get-FileHash (Join-Path $env:UPDATE_ROOT 'SyntexLauncher.exe') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:GOOD_HOST_HASH){throw 'Updated host hash mismatch.'}
          foreach($d in @('storage','data','instances','runtimes')){if((Get-Content (Join-Path $env:UPDATE_ROOT "$d\keep.txt") -Raw).Trim() -ne "KEEP-$d"){throw "Update changed $d user data."}}
          Get-Process SyntexLauncher -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'REAL_SELF_UPDATE_VISIBLE_START_AND_USER_DATA_PASS'

      - name: Build current good and rollback-test Setup executables
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function BuildSetup([string]$url,[string]$sha,[int64]$size,[string]$out,[string]$suffix){
            @('#pragma once',("static constexpr wchar_t PAYLOAD_URL[] = L`"{0}`";" -f $url),("static constexpr wchar_t PAYLOAD_SHA256[] = L`"{0}`";" -f $sha),("static constexpr unsigned long long PAYLOAD_SIZE = {0}ULL;" -f $size))|Set-Content .\rc-src\PayloadContract.h -Encoding utf8
            $cmd=Join-Path $env:RUNNER_TEMP "setup-$suffix.cmd"
            @('@echo on',"call `"$env:VSDEVCMD`" -arch=x64 -host_arch=x64",'if errorlevel 1 exit /b %errorlevel%',"cl.exe /nologo /DNOMINMAX /utf-8 /std:c++20 /EHsc /W4 /O2 /MT /I`"$env:GITHUB_WORKSPACE\rc-src`" `"$env:GITHUB_WORKSPACE\rc-src\Setup.cpp`" /Fe:`"$out`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 winhttp.lib bcrypt.lib shell32.lib ole32.lib user32.lib gdi32.lib advapi32.lib comctl32.lib uxtheme.lib",'exit /b %errorlevel%')|Set-Content $cmd -Encoding ascii
            & cmd.exe /d /c $cmd; if($LASTEXITCODE -ne 0){throw "Setup $suffix build failed."}
          }
          $good=Join-Path $env:DIST 'SyntexSetup-0.16.7-x64.exe'; $bad=Join-Path $env:DIST 'SyntexSetup-0.16.7-x64-rollback-test.exe'
          BuildSetup $env:GOOD_URL $env:GOOD_SHA ([int64]$env:GOOD_SIZE) $good 'good'
          BuildSetup $env:BAD_URL $env:BAD_SHA ([int64]$env:BAD_SIZE) $bad 'bad'
          "FINAL_SETUP=$good"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BAD_SETUP=$bad"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Real positive Setup repair with visible window
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:WORK 'setup-good'; Expand-Archive $env:BASE $root -Force
          foreach($d in @('storage','data','instances','runtimes')){New-Item -ItemType Directory -Force (Join-Path $root $d)|Out-Null; "KEEP-$d"|Set-Content (Join-Path $root "$d\keep.txt") -Encoding ascii}
          $p=Start-Process $env:FINAL_SETUP -ArgumentList @('--ci-install',"`"$root`"") -PassThru -Wait
          if($p.ExitCode -ne 0){throw "Good Setup failed: $($p.ExitCode)"}
          if((Get-FileHash (Join-Path $root 'SyntexLauncher.exe') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:GOOD_HOST_HASH){throw 'Setup installed wrong host.'}
          foreach($d in @('storage','data','instances','runtimes')){if((Get-Content (Join-Path $root "$d\keep.txt") -Raw).Trim() -ne "KEEP-$d"){throw "Setup changed $d user data."}}
          Get-Process SyntexLauncher -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'REAL_SETUP_REPAIR_VISIBLE_WINDOW_AND_USER_DATA_PASS'

      - name: Real automatic rollback with complete preservation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:WORK 'setup-bad'; Expand-Archive $env:BASE $root -Force
          foreach($d in @('storage','data','instances','runtimes')){New-Item -ItemType Directory -Force (Join-Path $root $d)|Out-Null; "KEEP-$d"|Set-Content (Join-Path $root "$d\keep.txt") -Encoding ascii}
          $old=(Get-FileHash (Join-Path $root 'SyntexLauncher.exe') -Algorithm SHA256).Hash
          $p=Start-Process $env:BAD_SETUP -ArgumentList @('--ci-install',"`"$root`"") -PassThru -Wait
          if($p.ExitCode -eq 0){throw 'Rollback-test Setup unexpectedly succeeded.'}
          if((Get-FileHash (Join-Path $root 'SyntexLauncher.exe') -Algorithm SHA256).Hash -ne $old){throw 'Rollback did not restore original host.'}
          foreach($d in @('storage','data','instances','runtimes')){if((Get-Content (Join-Path $root "$d\keep.txt") -Raw).Trim() -ne "KEEP-$d"){throw "Rollback changed $d user data."}}
          Write-Host 'REAL_SETUP_AUTOMATIC_ROLLBACK_AND_USER_DATA_PASS'

      - name: Upload final Setup only after all gates pass
        uses: actions/upload-artifact@v4
        with:
          name: SyntexSetup-0.16.7-x64-final
          path: ${{ env.FINAL_SETUP }}
          if-no-files-found: error
          retention-days: 7
