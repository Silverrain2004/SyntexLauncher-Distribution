name: Publish Syntex Launcher 0.16.5

on:
  push:
    paths:
      - '.github/workflows/publish-0.16.5.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout distribution repository
        uses: actions/checkout@v7

      - name: Download verified private build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/syntex-artifact.zip 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-4080-81f4-9214-4faa7ea72f66/raw?se=2026-09-09T14%3A28%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=afb14d74-45c0-555f-95c8-3f549979b612&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T08%3A18%3A36Z&ske=2026-09-10T08%3A18%3A36Z&sks=b&skv=2026-02-06&sig=r4sukWbP95r1Craod/Nj4aLamaEpFm1yr9JCHoURmxY%3D'
          mkdir -p /tmp/syntex
          unzip -q /tmp/syntex-artifact.zip -d /tmp/syntex

      - name: Verify release contract
        shell: bash
        run: |
          set -euo pipefail
          setup='/tmp/syntex/setup-native/SyntexLauncherSetup.exe'
          payload='/tmp/syntex/distribution/SyntexLauncher-0.16.5-win-x64.zip'
          test -f "$setup"
          test -f "$payload"
          test "$(stat -c%s "$setup")" = '358400'
          test "$(stat -c%s "$payload")" = '94901188'
          echo '357a0930ff5f6d9ee7fa99bfe44ca91a7f6ec3b43ba71ff5efbe84488d5b7eca  '"$setup" | sha256sum -c -
          echo 'a219a352bdbdc19ad0464de77214fadb6fc219e1a883fee8dfa88e3ba5078570  '"$payload" | sha256sum -c -

      - name: Create public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.16.5 \
            '/tmp/syntex/setup-native/SyntexLauncherSetup.exe#SyntexLauncherSetup.exe' \
            '/tmp/syntex/distribution/SyntexLauncher-0.16.5-win-x64.zip#SyntexLauncher-0.16.5-win-x64.zip' \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Syntex Launcher 0.16.5' \
            --notes 'Public binary distribution for Syntex Launcher 0.16.5 (Windows x64). Source code remains private. Setup verifies the launcher payload with SHA-256 before installation.'

      - name: Publish stable distribution manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('distribution.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['schemaVersion'] = 1
          data['product'] = 'Syntex Launcher'
          data['channel'] = 'stable'
          data['version'] = '0.16.5'
          data['runtimeIdentifier'] = 'win-x64'
          data['minimumWindowsBuild'] = 17763
          data['payload'] = {
              'url': 'https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.5/SyntexLauncher-0.16.5-win-x64.zip',
              'sha256': 'a219a352bdbdc19ad0464de77214fadb6fc219e1a883fee8dfa88e3ba5078570',
              'size': 94901188
          }
          data['languages'] = {'base': ['de-DE', 'en-US'], 'remote': []}
          data['publishedUtc'] = '2026-09-09T13:54:11Z'
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add distribution.json
          git commit -m 'Publish Syntex Launcher 0.16.5 manifest'
          git push
