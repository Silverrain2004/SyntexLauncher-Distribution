name: Build Syntex 0.16.6 Final v3

on:
  push:
    paths:
      - '.github/workflows/build-0166-final-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-publish:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare compact payload from verified 0.16.5 application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'syntex-0166-final-v3'
          $old = Join-Path $work 'old'
          $payload = Join-Path $work 'payload'
          New-Item -ItemType Directory -Force -Path $old, $payload, (Join-Path $payload 'app') | Out-Null
          $baseZip = Join-Path $work 'base-0.16.5.zip'
          Invoke-WebRequest -Uri 'https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.5/SyntexLauncher-0.16.5-win-x64.zip' -OutFile $baseZip -UseBasicParsing
          $baseHash = (Get-FileHash $baseZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($baseHash -ne 'a219a352bdbdc19ad0464de77214fadb6fc219e1a883fee8dfa88e3ba5078570') { throw "Base payload hash mismatch: $baseHash" }
          Expand-Archive -LiteralPath $baseZip -DestinationPath $old -Force
          if (-not (Test-Path (Join-Path $old 'SyntexLauncher.exe'))) { throw 'Base launcher executable missing.' }
          Get-ChildItem -LiteralPath $old -Force | ForEach-Object { Move-Item -LiteralPath $_.FullName -Destination (Join-Path $payload 'app') -Force }
          Get-ChildItem -LiteralPath (Join-Path $payload 'app') -Recurse -Filter '*.pdb' -File | Remove-Item -Force
          Copy-Item (Join-Path $payload 'app\SyntexLauncher.exe') (Join-Path $payload 'app\SyntexLauncher.App.exe') -Force
          "WORK=$work" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PAYLOAD=$payload" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Patch managed startup so the window appears before long initialization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $launcherDll = Join-Path $env:PAYLOAD 'app\SyntexLauncher.dll'
          if (-not (Test-Path $launcherDll)) { throw 'SyntexLauncher.dll not found in verified 0.16.5 payload.' }
          $patchRoot = Join-Path $env:RUNNER_TEMP 'syntex-ilpatch-v3'
          New-Item -ItemType Directory -Force -Path $patchRoot | Out-Null
          Push-Location $patchRoot
          try {
            dotnet new console --framework net10.0 --force | Out-Null
            dotnet add package Mono.Cecil --version 0.11.5 | Out-Null
            @'
          using Mono.Cecil;
          using Mono.Cecil.Cil;
          using System.Reflection;
          using System.Threading.Tasks;

          if (args.Length != 1) throw new ArgumentException("assembly path required");
          var path = args[0];
          var asm = AssemblyDefinition.ReadAssembly(path, new ReaderParameters { InMemory = true });
          var module = asm.MainModule;
          var type = module.Types.Single(t => t.FullName == "Syntex.Launcher.ViewModels.MainWindowViewModel");
          var original = type.Methods.Single(m => m.Name == "InitializeAsync" && !m.HasParameters && m.ReturnType.FullName == "System.Threading.Tasks.Task");
          if (type.Methods.Any(m => m.Name == "InitializeAsyncDeferredCore")) throw new InvalidOperationException("already patched");

          var clone = new MethodDefinition("InitializeAsyncDeferredCore", Mono.Cecil.MethodAttributes.Private | Mono.Cecil.MethodAttributes.HideBySig, module.ImportReference(original.ReturnType));
          type.Methods.Add(clone);
          clone.Body.InitLocals = original.Body.InitLocals;
          clone.Body.MaxStackSize = original.Body.MaxStackSize;
          var variableMap = new Dictionary<VariableDefinition, VariableDefinition>();
          foreach (var v in original.Body.Variables) {
              var nv = new VariableDefinition(module.ImportReference(v.VariableType));
              clone.Body.Variables.Add(nv);
              variableMap[v] = nv;
          }
          var instructionMap = new Dictionary<Instruction, Instruction>();
          foreach (var i in original.Body.Instructions) {
              var ni = Instruction.Create(OpCodes.Nop);
              ni.OpCode = i.OpCode;
              clone.Body.Instructions.Add(ni);
              instructionMap[i] = ni;
          }
          for (int idx = 0; idx < original.Body.Instructions.Count; idx++) {
              var src = original.Body.Instructions[idx];
              var dst = clone.Body.Instructions[idx];
              dst.Operand = src.Operand switch {
                  Instruction x => instructionMap[x],
                  Instruction[] xs => xs.Select(x => instructionMap[x]).ToArray(),
                  VariableDefinition v => variableMap[v],
                  ParameterDefinition p => clone.Parameters[p.Index],
                  _ => src.Operand
              };
          }
          foreach (var eh in original.Body.ExceptionHandlers) {
              clone.Body.ExceptionHandlers.Add(new ExceptionHandler(eh.HandlerType) {
                  CatchType = eh.CatchType,
                  TryStart = eh.TryStart is null ? null : instructionMap[eh.TryStart],
                  TryEnd = eh.TryEnd is null ? null : instructionMap[eh.TryEnd],
                  HandlerStart = eh.HandlerStart is null ? null : instructionMap[eh.HandlerStart],
                  HandlerEnd = eh.HandlerEnd is null ? null : instructionMap[eh.HandlerEnd],
                  FilterStart = eh.FilterStart is null ? null : instructionMap[eh.FilterStart]
              });
          }

          original.Body = new MethodBody(original) { InitLocals = false, MaxStackSize = 1 };
          var il = original.Body.GetILProcessor();
          il.Append(il.Create(OpCodes.Ldarg_0));
          il.Append(il.Create(OpCodes.Call, clone));
          il.Append(il.Create(OpCodes.Pop));
          var completed = typeof(Task).GetProperty(nameof(Task.CompletedTask), BindingFlags.Public | BindingFlags.Static)!.GetMethod!;
          il.Append(il.Create(OpCodes.Call, module.ImportReference(completed)));
          il.Append(il.Create(OpCodes.Ret));

          var temp = path + ".patched";
          asm.Write(temp);
          asm.Dispose();
          File.Copy(temp, path, true);
          File.Delete(temp);
          Console.WriteLine("PATCH_OK");
          '@ | Set-Content -LiteralPath '.\Program.cs' -Encoding utf8
            dotnet run -c Release -- $launcherDll
            if ($LASTEXITCODE -ne 0) { throw "Managed startup patch failed: $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Locate Visual C++ x64 tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vs)) { throw 'Visual C++ x64 tools not found.' }
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $dev)) { throw "VsDevCmd missing: $dev" }
          "VSDEVCMD=$dev" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build native x64 launcher host and uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmd = Join-Path $env:RUNNER_TEMP 'build-native-final-v3.cmd'
          @(
            '@echo on',
            "call `"$env:VSDEVCMD`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            "cl.exe /nologo /utf-8 /std:c++20 /EHsc /W4 /O1 /Os /GL /MT `"$pwd\rc-src\LauncherHost.cpp`" /Fe:`"$env:PAYLOAD\SyntexLauncher.exe`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF shell32.lib user32.lib",
            'if errorlevel 1 exit /b %errorlevel%',
            "cl.exe /nologo /utf-8 /std:c++20 /EHsc /W4 /O1 /Os /GL /MT `"$pwd\rc-src\Uninstaller.cpp`" /Fe:`"$env:PAYLOAD\app\SyntexUninstall.exe`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF shell32.lib user32.lib advapi32.lib ole32.lib",
            'exit /b %errorlevel%'
          ) | Set-Content -LiteralPath $cmd -Encoding ascii
          & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Native build failed: $LASTEXITCODE" }

      - name: Prove real managed GUI starts before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rootFiles = @(Get-ChildItem -LiteralPath $env:PAYLOAD -File)
          $rootDirs = @(Get-ChildItem -LiteralPath $env:PAYLOAD -Directory)
          if ($rootFiles.Count -ne 1 -or $rootFiles[0].Name -ne 'SyntexLauncher.exe') { throw "Unexpected root files: $($rootFiles.Name -join ', ')" }
          if ($rootDirs.Count -ne 1 -or $rootDirs[0].Name -ne 'app') { throw "Unexpected root dirs: $($rootDirs.Name -join ', ')" }
          $logTest = Start-Process -FilePath (Join-Path $env:PAYLOAD 'SyntexLauncher.exe') -ArgumentList '--host-log-self-test' -PassThru -Wait
          if ($logTest.ExitCode -ne 0) { throw "Startup log self-test failed: $($logTest.ExitCode)" }
          $gui = Start-Process -FilePath (Join-Path $env:PAYLOAD 'SyntexLauncher.exe') -ArgumentList '--ci-gui-self-test' -PassThru -Wait
          if ($gui.ExitCode -ne 0) {
            Get-ChildItem -LiteralPath (Join-Path $env:PAYLOAD 'storage\logs\launcher-startup') -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -Raw }
            $fatal = Join-Path $env:PAYLOAD 'app\diagnostics\bootstrap-fatal.log'
            if (Test-Path $fatal) { Write-Host '--- managed bootstrap fatal ---'; Get-Content $fatal -Raw | Out-Host }
            throw "Real managed GUI startup failed: $($gui.ExitCode)"
          }
          Write-Host 'REAL_MANAGED_GUI_STARTUP_PASS'
          Remove-Item (Join-Path $env:PAYLOAD 'storage') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Create maximum-compression payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:WORK 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $zip = Join-Path $dist 'SyntexLauncher-0.16.6-win-x64.zip'
          Push-Location $env:PAYLOAD
          try { & 7z a -tzip -mx=9 -mfb=258 -mpass=15 -y $zip '.\*' | Out-Host } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw "7z failed: $LASTEXITCODE" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $zip).Length
          "ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIP_HASH=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIP_SIZE=$size" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Payload $size bytes SHA256 $hash"

      - name: Build small verified Setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @"
          #pragma once
          #define PAYLOAD_URL L"https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.6/SyntexLauncher-0.16.6-win-x64.zip"
          #define PAYLOAD_SHA256 L"$env:ZIP_HASH"
          #define PAYLOAD_SIZE $($env:ZIP_SIZE)ULL
          "@ | Set-Content -LiteralPath '.\rc-src\PayloadContract.h' -Encoding utf8
          $setup = Join-Path $env:WORK 'dist\SyntexLauncherSetup-0.16.6-win-x64.exe'
          $src = Get-Content '.\rc-src\Setup.cpp' -Raw
          $src = $src.Replace('0.16.6 RC1','0.16.6').Replace('0.16.6-RC1','0.16.6')
          $finalSrc = Join-Path $env:RUNNER_TEMP 'Setup-0.16.6-final-v3.cpp'
          Set-Content -LiteralPath $finalSrc -Value $src -Encoding utf8
          $cmd = Join-Path $env:RUNNER_TEMP 'build-setup-final-v3.cmd'
          @(
            '@echo on',
            "call `"$env:VSDEVCMD`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            "cl.exe /nologo /utf-8 /std:c++20 /EHsc /W4 /O1 /Os /GL /MT /I`"$pwd\rc-src`" `"$finalSrc`" /Fe:`"$setup`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF winhttp.lib bcrypt.lib shell32.lib ole32.lib user32.lib gdi32.lib advapi32.lib comctl32.lib uxtheme.lib",
            'exit /b %errorlevel%'
          ) | Set-Content -LiteralPath $cmd -Encoding ascii
          & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Setup build failed: $LASTEXITCODE" }
          if ((Get-Item $setup).Length -gt 5MB) { throw "Setup exceeds 5 MiB: $((Get-Item $setup).Length)" }
          "SETUP=$setup" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run setup self-tests and GUI smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($arg in @('--self-test','--log-self-test','--repair-self-test')) {
            $p = Start-Process -FilePath $env:SETUP -ArgumentList $arg -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "Setup self-test $arg failed: $($p.ExitCode)" }
          }
          $p = Start-Process -FilePath $env:SETUP -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do { Start-Sleep -Milliseconds 100; $p.Refresh(); if ($p.HasExited) { throw "Setup exited before GUI: $($p.ExitCode)" } }
            while ($p.MainWindowHandle -eq [IntPtr]::Zero -and [DateTime]::UtcNow -lt $deadline)
            if ($p.MainWindowHandle -eq [IntPtr]::Zero) { throw 'Setup did not open native GUI.' }
          } finally { if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } }

      - name: Publish temporary v0.16.6 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v0.16.6 *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete v0.16.6 --cleanup-tag -y }
          gh release create v0.16.6 $env:ZIP $env:SETUP --prerelease --title 'Syntex Launcher 0.16.6' --notes 'Windows x64 repair release.'
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed: $LASTEXITCODE" }

      - name: Full public download-install-launch E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Sleep -Seconds 5
          $target = Join-Path $env:RUNNER_TEMP 'Syntex-0166-Final-v3-E2E'
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $env:SETUP -ArgumentList @('--ci-install', $target) -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            $logDir = Join-Path (Split-Path $env:SETUP -Parent) 'SyntexSetup-Log'
            if (Test-Path $logDir) { Get-ChildItem $logDir -File | ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -Raw } }
            if (Test-Path (Join-Path $target 'storage\logs\launcher-startup')) { Get-ChildItem (Join-Path $target 'storage\logs\launcher-startup') -File | ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -Raw } }
            throw "FULL PUBLIC INSTALL E2E FAILED: $($p.ExitCode)"
          }
          Write-Host 'FULL_PUBLIC_DOWNLOAD_INSTALL_MANAGED_GUI_PASS'

      - name: Promote release and write checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release edit v0.16.6 --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release promotion failed: $LASTEXITCODE" }
          $setupHash = (Get-FileHash $env:SETUP -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSize = (Get-Item $env:SETUP).Length
          @"
          version=0.16.6
          setup_size=$setupSize
          setup_sha256=$setupHash
          payload_size=$env:ZIP_SIZE
          payload_sha256=$env:ZIP_HASH
          "@ | Set-Content (Join-Path $env:WORK 'dist\SHA256SUMS.txt') -Encoding ascii
          Write-Host "FINAL SETUP $setupSize bytes SHA256 $setupHash"

      - uses: actions/upload-artifact@v4
        with:
          name: SyntexLauncherSetup-0.16.6-win-x64
          path: |
            ${{ env.SETUP }}
            ${{ env.WORK }}\dist\SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
