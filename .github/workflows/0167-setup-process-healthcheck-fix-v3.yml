name: Syntex 0.16.7 Setup Process and Healthcheck Fix V3

on:
  push:
    branches: ['fix/0.16.7-setup-process-healthcheck']
    paths:
      - '.github/workflows/0167-setup-process-healthcheck-fix-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-fixed-setup:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GOOD_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.7-ci-34467708548/SyntexLauncher-0.16.7-ci-win-x64.zip
      GOOD_SHA: cc716db79bc5eb8cae80413aa2fe5cce519e05e3c2b12b9e11ae943c1780207f
      GOOD_SIZE: 70090490
      BASE_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.6/SyntexLauncher-0.16.6-win-x64.zip
      BASE_SHA: f34397dae9ca7986ef5d8f9183c6d4ee355126d2c9b913dea6eee561835ada74
      BASE_SIZE: 69903997
    steps:
      - uses: actions/checkout@v4

      - name: Patch Setup source with deterministic process drain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'rc-src\Setup.cpp'
          $s=Get-Content $src -Raw
          $s=$s.Replace('#include <windows.h>', "#include <windows.h>`r`n#include <tlhelp32.h>")
          $anchor='static bool LaunchVerify(const fs::path& root, bool ciMode, std::wstring& error) {'
          if(-not $s.Contains($anchor)){throw 'LaunchVerify anchor missing'}
          $helper=@'
static bool IsPathInsideSetup(const fs::path& candidate, const fs::path& directory) {
    std::error_code ec;
    const auto value = fs::absolute(candidate, ec).lexically_normal().wstring();
    if (ec) return false;
    ec.clear();
    auto prefix = fs::absolute(directory, ec).lexically_normal().wstring();
    if (ec) return false;
    while (!prefix.empty() && (prefix.back() == L'\\' || prefix.back() == L'/')) prefix.pop_back();
    prefix.push_back(L'\\');
    return value.size() >= prefix.size() && _wcsnicmp(value.c_str(), prefix.c_str(), prefix.size()) == 0;
}

static std::vector<DWORD> OwnedLauncherProcessIds(const fs::path& root) {
    std::vector<DWORD> result;
    std::error_code ec;
    const auto host = fs::absolute(root / L"SyntexLauncher.exe", ec).lexically_normal();
    if (ec) return result;
    ec.clear();
    const auto app = fs::absolute(root / L"app", ec).lexically_normal();
    if (ec) return result;

    HANDLE snapshot = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);
    if (snapshot == INVALID_HANDLE_VALUE) return result;
    PROCESSENTRY32W entry{};
    entry.dwSize = sizeof(entry);
    if (Process32FirstW(snapshot, &entry)) {
        do {
            if (entry.th32ProcessID == 0 || entry.th32ProcessID == GetCurrentProcessId()) continue;
            HANDLE process = OpenProcess(PROCESS_QUERY_LIMITED_INFORMATION, FALSE, entry.th32ProcessID);
            if (!process) continue;
            std::wstring image(32768, L'\0');
            DWORD imageLength = static_cast<DWORD>(image.size());
            if (QueryFullProcessImageNameW(process, 0, image.data(), &imageLength) && imageLength > 0) {
                image.resize(imageLength);
                const fs::path processPath = fs::path(image).lexically_normal();
                if (_wcsicmp(processPath.c_str(), host.c_str()) == 0 || IsPathInsideSetup(processPath, app))
                    result.push_back(entry.th32ProcessID);
            }
            CloseHandle(process);
        } while (Process32NextW(snapshot, &entry));
    }
    CloseHandle(snapshot);
    return result;
}

static void RequestCloseForPid(DWORD pid) {
    struct Context { DWORD pid; } context{pid};
    EnumWindows([](HWND hwnd, LPARAM value) -> BOOL {
        auto* context = reinterpret_cast<Context*>(value);
        DWORD windowPid = 0;
        GetWindowThreadProcessId(hwnd, &windowPid);
        if (windowPid == context->pid) PostMessageW(hwnd, WM_CLOSE, 0, 0);
        return TRUE;
    }, reinterpret_cast<LPARAM>(&context));
}

static bool StopLauncherProgramProcesses(const fs::path& root, std::wstring& error) noexcept {
    try {
        // First ask every Syntex window in this exact installation root to close normally.
        for (const DWORD pid : OwnedLauncherProcessIds(root)) RequestCloseForPid(pid);
        const ULONGLONG gracefulDeadline = GetTickCount64() + 5000;
        while (GetTickCount64() < gracefulDeadline) {
            if (OwnedLauncherProcessIds(root).empty()) return true;
            Sleep(100);
        }

        // Then terminate only remaining Syntex program processes belonging to this exact root.
        const ULONGLONG hardDeadline = GetTickCount64() + 10000;
        while (GetTickCount64() < hardDeadline) {
            const auto pids = OwnedLauncherProcessIds(root);
            if (pids.empty()) return true;
            for (const DWORD pid : pids) {
                HANDLE process = OpenProcess(PROCESS_TERMINATE | SYNCHRONIZE, FALSE, pid);
                if (!process) continue;
                TerminateProcess(process, 206);
                WaitForSingleObject(process, 2000);
                CloseHandle(process);
            }
            Sleep(100);
        }

        const auto remaining = OwnedLauncherProcessIds(root);
        if (!remaining.empty()) {
            error = L"Syntex Launcher konnte für Installation/Aktualisierung nicht vollständig beendet werden. Bitte den Launcher schließen und Setup erneut starten.";
            return false;
        }
        return true;
    } catch (...) {
        error = L"Laufende Syntex-Prozesse konnten vor Installation/Aktualisierung nicht zuverlässig beendet werden.";
        return false;
    }
}

'@
          $s=$s.Replace($anchor,$helper+$anchor)
          $old='const std::wstring command = Quote(host.wstring()) + (ciMode ? L" --ci-gui-self-test" : L"");'
          if(-not $s.Contains($old)){throw 'LaunchVerify command anchor missing'}
          $s=$s.Replace($old,'const std::wstring command = Quote(host.wstring()) + L" --post-update-health-check";')
          $old2='if (!ValidateWritableRoot(root, error)) { cleanup(); return false; }'
          if(-not $s.Contains($old2)){throw 'Writable-root anchor missing'}
          $new2=$old2+"`r`n`r`n    progress(6, L`"Laufender Syntex Launcher wird für Installation/Aktualisierung beendet …`" );`r`n    if (!StopLauncherProgramProcesses(root, error)) { cleanup(); return false; }"
          $s=$s.Replace($old2,$new2)
          $s=$s.Replace('Syntex Launcher Setup 0.16.6 RC1','Syntex Launcher Setup 0.16.7')
          $s=$s.Replace('Syntex Launcher Setup 0.16.6','Syntex Launcher Setup 0.16.7')
          $s=$s.Replace('SyntexLauncherSetup/0.16.6-RC1','SyntexLauncherSetup/0.16.7')
          $s=$s.Replace('DisplayVersion", L"0.16.6"','DisplayVersion", L"0.16.7"')
          Set-Content $src $s -Encoding utf8
          $check=Get-Content $src -Raw
          foreach($needle in @('OwnedLauncherProcessIds','RequestCloseForPid','StopLauncherProgramProcesses(root, error)','--post-update-health-check')){if(-not $check.Contains($needle)){throw "missing $needle"}}
          Write-Host 'SETUP_DETERMINISTIC_PROCESS_DRAIN_PATCH_PASS'

      - name: Verify immutable payload inputs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $work=Join-Path $env:RUNNER_TEMP 'setup-process-fix-v3';$dist=Join-Path $work 'dist';New-Item -ItemType Directory -Force $work,$dist|Out-Null
          function Get-Verified($url,$sha,$size,$name){$p=Join-Path $work $name;Invoke-WebRequest $url -OutFile $p -UseBasicParsing;if((Get-Item $p).Length-ne[int64]$size){throw "$name size mismatch"};if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()-ne$sha){throw "$name hash mismatch"};$p}
          $base=Get-Verified $env:BASE_URL $env:BASE_SHA $env:BASE_SIZE 'base.zip';$null=Get-Verified $env:GOOD_URL $env:GOOD_SHA $env:GOOD_SIZE 'good.zip'
          "WORK=$work"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append;"DIST=$dist"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append;"BASE_ZIP=$base"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build fixed x64 setup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @('#pragma once',("static constexpr wchar_t PAYLOAD_URL[] = L`"{0}`";" -f $env:GOOD_URL),("static constexpr wchar_t PAYLOAD_SHA256[] = L`"{0}`";" -f $env:GOOD_SHA),("static constexpr unsigned long long PAYLOAD_SIZE = {0}ULL;" -f $env:GOOD_SIZE))|Set-Content .\rc-src\PayloadContract.h -Encoding utf8
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe';$vs=&$vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath;if([string]::IsNullOrWhiteSpace($vs)){throw 'VC++ x64 missing'};$dev=Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $src=Join-Path $env:GITHUB_WORKSPACE 'rc-src\Setup.cpp';$out=Join-Path $env:DIST 'SyntexSetup-0.16.7-x64-PROCESS-FIX-V3.exe';$cmd=Join-Path $env:RUNNER_TEMP 'build-process-fix-v3.cmd'
          @('@echo on',"call `"$dev`" -arch=x64 -host_arch=x64",'if errorlevel 1 exit /b %errorlevel%',"cl.exe /nologo /DNOMINMAX /utf-8 /std:c++20 /EHsc /W4 /O2 /MT /I`"$env:GITHUB_WORKSPACE\rc-src`" `"$src`" /Fe:`"$out`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 winhttp.lib bcrypt.lib shell32.lib ole32.lib user32.lib gdi32.lib advapi32.lib comctl32.lib uxtheme.lib",'exit /b %errorlevel%')|Set-Content $cmd -Encoding ascii;&cmd.exe /d /c $cmd;if($LASTEXITCODE-ne0){throw 'Setup build failed'};"FINAL_SETUP=$out"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Selftests and x64
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($arg in @('--self-test','--repair-self-test','--log-self-test')){$p=Start-Process $env:FINAL_SETUP -ArgumentList $arg -PassThru -Wait;if($p.ExitCode-ne0){throw "$arg failed $($p.ExitCode)"}}
          $b=[IO.File]::ReadAllBytes($env:FINAL_SETUP);$lf=[BitConverter]::ToInt32($b,0x3c);if($b[0]-ne0x4d -or $b[1]-ne0x5a -or [BitConverter]::ToUInt16($b,$lf+4)-ne0x8664){throw 'Setup not AMD64 PE'}
          Write-Host 'SETUP_PROCESS_FIX_V3_X64_SELFTEST_PASS'

      - name: Real repair with already running launcher
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:WORK 'running-root';Expand-Archive $env:BASE_ZIP $root -Force
          foreach($d in @('storage','data','instances','runtimes')){New-Item -ItemType Directory -Force (Join-Path $root $d)|Out-Null;"KEEP-$d"|Set-Content (Join-Path $root "$d\keep.txt") -Encoding ascii}
          $old=Start-Process (Join-Path $root 'SyntexLauncher.exe') -WorkingDirectory $root -PassThru;Start-Sleep -Seconds 3
          if($old.HasExited){throw "old launcher exited too early $($old.ExitCode)"};$oldPid=$old.Id;Write-Host "OLD_PID=$oldPid"
          $setup=Start-Process $env:FINAL_SETUP -ArgumentList @('--ci-install',"`"$root`"") -PassThru -Wait
          if($setup.ExitCode-ne0){$logs=Join-Path $root 'storage\logs';if(Test-Path $logs){Get-ChildItem $logs -Recurse -File|ForEach-Object{Write-Host "---$($_.FullName)---";Get-Content $_.FullName -Raw|Write-Host}};throw "setup exit $($setup.ExitCode)"}
          if(Get-Process -Id $oldPid -ErrorAction SilentlyContinue){throw 'old host survived setup'}
          foreach($d in @('storage','data','instances','runtimes')){if((Get-Content (Join-Path $root "$d\keep.txt") -Raw).Trim()-ne"KEEP-$d"){throw "changed $d"}}
          $startup=Join-Path $root 'storage\logs\launcher-startup';$latest=Get-ChildItem $startup -File|Sort-Object LastWriteTimeUtc -Descending|Select-Object -First 1;$text=Get-Content $latest.FullName -Raw;Write-Host $text
          if(-not $text.Contains('Startprüfung erfolgreich: sichtbares Launcher-Fenster erkannt.')){throw 'visible launcher healthcheck marker missing'}
          Get-Process SyntexLauncher -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'SETUP_RUNNING_LAUNCHER_AUTO_CLOSE_VISIBLE_START_PASS'

      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: SyntexSetup-0.16.7-x64-process-fix-v3
          path: ${{ env.FINAL_SETUP }}
          if-no-files-found: error
          retention-days: 7
