name: Syntex 0.16.7 Repair Backup Start Isolation

on:
  push:
    branches: ['fix/0.16.7-setup-process-healthcheck']
    paths:
      - '.github/workflows/0167-repair-backup-start-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate-backup:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GOOD_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.7-ci-34467708548/SyntexLauncher-0.16.7-ci-win-x64.zip
      GOOD_SHA: cc716db79bc5eb8cae80413aa2fe5cce519e05e3c2b12b9e11ae943c1780207f
      GOOD_SIZE: 70090490
      BASE_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.6/SyntexLauncher-0.16.6-win-x64.zip
      BASE_SHA: f34397dae9ca7986ef5d8f9183c6d4ee355126d2c9b913dea6eee561835ada74
      BASE_SIZE: 69903997
    steps:
      - uses: actions/checkout@v4

      - name: Prepare verified roots
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $work=Join-Path $env:RUNNER_TEMP 'backup-start-isolation';New-Item -ItemType Directory -Force $work|Out-Null
          function Get-Verified($url,$sha,$size,$name){$p=Join-Path $work $name;Invoke-WebRequest $url -OutFile $p -UseBasicParsing;if((Get-Item $p).Length-ne[int64]$size){throw "$name size"};if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()-ne$sha){throw "$name hash"};$p}
          $base=Get-Verified $env:BASE_URL $env:BASE_SHA $env:BASE_SIZE 'base.zip';$good=Get-Verified $env:GOOD_URL $env:GOOD_SHA $env:GOOD_SIZE 'good.zip'
          $old=Join-Path $work 'old';$root=Join-Path $work 'root';Expand-Archive $base $old -Force;Expand-Archive $good $root -Force
          $backup=Join-Path $root '.syntex-repair-backup';New-Item -ItemType Directory -Force $backup|Out-Null
          foreach($item in Get-ChildItem $old -Force){if(@('storage','data','instances','runtimes','cache','downloads','logs','creator','diagnostics','temp','updates','fehleranalysen','saves','screenshots','resourcepacks','shaderpacks','config','profiles','accounts','backups') -contains $item.Name.ToLowerInvariant()){continue};Copy-Item $item.FullName (Join-Path $backup $item.Name) -Recurse -Force}
          "ROOT=$root"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'REPAIR_BACKUP_CREATED_WITH_OLD_PROGRAM_TREE'

      - name: Start current payload with old repair backup present
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:ROOT 'SyntexLauncher.exe'
          $p=Start-Process $exe -ArgumentList '--post-update-health-check' -WorkingDirectory $env:ROOT -PassThru
          if(-not $p.WaitForExit(130000)){try{$p.Kill($true)}catch{};throw 'healthcheck host did not return'}
          Write-Host "BACKUP_PRESENT_HEALTHCHECK_EXIT=$($p.ExitCode)"
          $logs=Join-Path $env:ROOT 'storage\logs\launcher-startup';if(Test-Path $logs){Get-ChildItem $logs -File|ForEach-Object{Get-Content $_.FullName -Raw|Write-Host}}
          Get-Process SyntexLauncher -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          if($p.ExitCode-ne0){throw "backup-present healthcheck failed $($p.ExitCode)"}
          Write-Host 'REPAIR_BACKUP_PRESENT_VISIBLE_WINDOW_PASS'
