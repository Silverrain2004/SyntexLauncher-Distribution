name: Fix Syntex 0.16.6 v2 workflow

on:
  push:
    paths:
      - '.github/workflows/fix-build-0166-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct managed launcher assembly name
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-0166-final-v2.yml')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace("app\\Syntex.Launcher.dll", "app\\SyntexLauncher.dll")
          s = s.replace("Syntex.Launcher.dll not found in verified 0.16.5 payload.", "SyntexLauncher.dll not found in verified 0.16.5 payload.")
          if s == old:
              raise SystemExit('Expected assembly-name text not found')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-0166-final-v2.yml
          git commit -m 'Fix managed launcher assembly name in 0.16.6 build'
          git push
