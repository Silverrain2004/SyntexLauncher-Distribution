name: Syntex 0.16.7 Setup Final V3

on:
  workflow_dispatch:
  push:
    branches: ['feat/0.16.7-self-update']
    paths:
      - '.github/workflows/0167-setup-final-v3.yml'

permissions:
  contents: read

jobs:
  windows-setup-final:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GOOD_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.7-ci-34467708548/SyntexLauncher-0.16.7-ci-win-x64.zip
      GOOD_SHA: cc716db79bc5eb8cae80413aa2fe5cce519e05e3c2b12b9e11ae943c1780207f
      GOOD_SIZE: 70090490
      BAD_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.7-ci-bad-34467708548/SyntexLauncher-0.16.7-ci-bad-win-x64.zip
      BAD_SHA: bf0ec4a9cb0dfe23b8299b0c67269a71c01a2e9819c72af2c03ae8cb686a096a
      BAD_SIZE: 70087569
      BASE_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.6/SyntexLauncher-0.16.6-win-x64.zip
      BASE_SHA: f34397dae9ca7986ef5d8f9183c6d4ee355126d2c9b913dea6eee561835ada74
      BASE_SIZE: 69903997

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/0.16.7-self-update

      - name: Verify immutable inputs and prepare roots
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $work=Join-Path $env:RUNNER_TEMP 'syntex-setup-final-v3';$dist=Join-Path $work 'dist';New-Item -ItemType Directory -Force $work,$dist|Out-Null
          function Get-Verified($url,$sha,$size,$name){$p=Join-Path $env:RUNNER_TEMP $name;Invoke-WebRequest $url -OutFile $p -UseBasicParsing;if((Get-Item $p).Length -ne [int64]$size){throw "$name size mismatch"};if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha){throw "$name hash mismatch"};$p}
          $base=Get-Verified $env:BASE_URL $env:BASE_SHA $env:BASE_SIZE 'base-v3.zip';$good=Get-Verified $env:GOOD_URL $env:GOOD_SHA $env:GOOD_SIZE 'good-v3.zip';$null=Get-Verified $env:BAD_URL $env:BAD_SHA $env:BAD_SIZE 'bad-v3.zip'
          $extract=Join-Path $work 'good-extract';Expand-Archive $good $extract -Force
          "WORK=$work"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append;"DIST=$dist"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append;"BASE_ZIP=$base"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GOOD_HOST_HASH=$((Get-FileHash (Join-Path $extract 'SyntexLauncher.exe') -Algorithm SHA256).Hash.ToLowerInvariant())"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build good and bad x64 Setup from current source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Get-Content .\rc-src\Setup.cpp -Raw
          $pattern='(?ms)(if \(argv && argc == 3 && _wcsicmp\(argv\[1\], L"--ci-install"\) == 0\) \{.*?if \(!ok\) \{ WriteSetupLog\(L"CI install E2E: " \+ error\); return 5; \})\s*std::error_code ec;\s*fs::remove_all\(target, ec\);\s*return 0;'
          $replacement='${1}'+[Environment]::NewLine+'        return 0;'
          $source2=[regex]::Replace($source,$pattern,$replacement,1)
          if($source2 -eq $source -or $source2.Contains('fs::remove_all(target, ec);')){throw 'Inspectable CI source transformation failed.'}
          $src=Join-Path $env:RUNNER_TEMP 'Setup-final-v3.cpp';Set-Content $src $source2 -Encoding utf8
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe';$vs=&$vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath;if([string]::IsNullOrWhiteSpace($vs)){throw 'VC++ x64 missing'};$dev=Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          function Build-Setup($url,$sha,$size,$out,$suffix){@('#pragma once',("static constexpr wchar_t PAYLOAD_URL[] = L`"{0}`";" -f $url),("static constexpr wchar_t PAYLOAD_SHA256[] = L`"{0}`";" -f $sha),("static constexpr unsigned long long PAYLOAD_SIZE = {0}ULL;" -f $size))|Set-Content .\rc-src\PayloadContract.h -Encoding utf8;$cmd=Join-Path $env:RUNNER_TEMP "build-setup-v3-$suffix.cmd";@('@echo on',"call `"$dev`" -arch=x64 -host_arch=x64",'if errorlevel 1 exit /b %errorlevel%',"cl.exe /nologo /DNOMINMAX /utf-8 /std:c++20 /EHsc /W4 /O2 /MT /I`"$env:GITHUB_WORKSPACE\rc-src`" `"$src`" /Fe:`"$out`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 winhttp.lib bcrypt.lib shell32.lib ole32.lib user32.lib gdi32.lib advapi32.lib comctl32.lib uxtheme.lib",'exit /b %errorlevel%')|Set-Content $cmd -Encoding ascii;&cmd.exe /d /c $cmd;if($LASTEXITCODE -ne 0){throw "Setup $suffix build failed"}}
          $good=Join-Path $env:DIST 'SyntexSetup-0.16.7-x64.exe';$bad=Join-Path $env:DIST 'SyntexSetup-0.16.7-x64-rollback-test.exe';Build-Setup $env:GOOD_URL $env:GOOD_SHA $env:GOOD_SIZE $good 'good';Build-Setup $env:BAD_URL $env:BAD_SHA $env:BAD_SIZE $bad 'bad'
          "FINAL_SETUP=$good"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append;"BAD_SETUP=$bad"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify setup selftests progress Unicode and log location
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($arg in @('--self-test','--repair-self-test','--log-self-test')){$p=Start-Process $env:FINAL_SETUP -ArgumentList $arg -PassThru -Wait;if($p.ExitCode -ne 0){throw "$arg failed: $($p.ExitCode)"}}
          $log=Join-Path $env:DIST 'SyntexSetup-Log';if(-not(Test-Path $log) -or -not(Get-ChildItem $log -File)){throw 'SyntexSetup-Log next to setup missing.'}
          $src=Get-Content .\rc-src\Setup.cpp -Raw;foreach($needle in @('PROGRESS_CLASSW','PBM_SETPOS','Durchsuchen…','Installationsordner')){if(-not $src.Contains($needle)){throw "UI contract missing: $needle"}}
          Write-Host 'SETUP_SELFTEST_PROGRESS_UNICODE_LOG_PASS'

      - name: Real successful repair visible start and user-data preservation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:WORK 'good-root';Expand-Archive $env:BASE_ZIP $root -Force;foreach($d in @('storage','data','instances','runtimes')){New-Item -ItemType Directory -Force (Join-Path $root $d)|Out-Null;"KEEP-$d"|Set-Content (Join-Path $root "$d\keep.txt") -Encoding ascii}
          $p=Start-Process $env:FINAL_SETUP -ArgumentList @('--ci-install',"`"$root`"") -PassThru -Wait
          if($p.ExitCode -ne 0){$logs=Join-Path $env:DIST 'SyntexSetup-Log';if(Test-Path $logs){Get-ChildItem $logs -File|ForEach-Object{Write-Host "--- $($_.FullName) ---";Get-Content $_.FullName -Raw}};$startup=Join-Path $root 'storage\logs\launcher-startup';if(Test-Path $startup){Get-ChildItem $startup -File|ForEach-Object{Write-Host "--- $($_.FullName) ---";Get-Content $_.FullName -Raw}};throw "Good Setup exit $($p.ExitCode)"}
          if((Get-FileHash (Join-Path $root 'SyntexLauncher.exe') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:GOOD_HOST_HASH){throw 'Good Setup host mismatch'}
          foreach($d in @('storage','data','instances','runtimes')){if((Get-Content (Join-Path $root "$d\keep.txt") -Raw).Trim() -ne "KEEP-$d"){throw "Good Setup changed $d"}}
          Get-Process SyntexLauncher -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'SETUP_REAL_REPAIR_VISIBLE_START_ALL_USER_DATA_PASS'

      - name: Real failed repair automatic rollback and user-data preservation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:WORK 'bad-root';Expand-Archive $env:BASE_ZIP $root -Force;foreach($d in @('storage','data','instances','runtimes')){New-Item -ItemType Directory -Force (Join-Path $root $d)|Out-Null;"KEEP-$d"|Set-Content (Join-Path $root "$d\keep.txt") -Encoding ascii};$old=(Get-FileHash (Join-Path $root 'SyntexLauncher.exe') -Algorithm SHA256).Hash
          $p=Start-Process $env:BAD_SETUP -ArgumentList @('--ci-install',"`"$root`"") -PassThru -Wait;if($p.ExitCode -eq 0){throw 'Bad Setup unexpectedly succeeded'}
          if((Get-FileHash (Join-Path $root 'SyntexLauncher.exe') -Algorithm SHA256).Hash -ne $old){throw 'Rollback host mismatch'}
          foreach($d in @('storage','data','instances','runtimes')){if((Get-Content (Join-Path $root "$d\keep.txt") -Raw).Trim() -ne "KEEP-$d"){throw "Rollback changed $d"}}
          Write-Host 'SETUP_REAL_AUTOMATIC_ROLLBACK_ALL_USER_DATA_PASS'

      - name: Upload verified final x64 setup
        uses: actions/upload-artifact@v4
        with:
          name: SyntexSetup-0.16.7-x64-final-v3
          path: ${{ env.FINAL_SETUP }}
          if-no-files-found: error
          retention-days: 7
