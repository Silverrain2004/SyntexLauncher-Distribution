name: Syntex 0.16.7 Setup Positive Diagnostic

on:
  workflow_dispatch:
  push:
    branches: ['feat/0.16.7-self-update']
    paths:
      - '.github/workflows/0167-setup-positive-diagnostic.yml'

permissions:
  contents: read

jobs:
  windows-setup-positive:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      GOOD_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.7-ci-34464842635/SyntexLauncher-0.16.7-ci-win-x64.zip
      GOOD_SHA: dc1121cda940ab551868e55d6c1fafe5f98178d35683b753ca156d2fd38fc3a5
      GOOD_SIZE: 70090681
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/0.16.7-self-update

      - name: Prepare verified candidate and 0.16.6 repair root
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $work=Join-Path $env:RUNNER_TEMP 'syntex-setup-positive-diagnostic'
          $root=Join-Path $work 'repair-root'
          $dist=Join-Path $work 'dist'
          New-Item -ItemType Directory -Force -Path $work,$root,$dist | Out-Null
          $good=Join-Path $work 'good.zip'; $base=Join-Path $work 'base.zip'
          Invoke-WebRequest $env:GOOD_URL -OutFile $good -UseBasicParsing
          if((Get-Item $good).Length -ne [int64]$env:GOOD_SIZE -or (Get-FileHash $good -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:GOOD_SHA){throw 'Good candidate verification failed.'}
          Invoke-WebRequest 'https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.6/SyntexLauncher-0.16.6-win-x64.zip' -OutFile $base -UseBasicParsing
          if((Get-Item $base).Length -ne 69903997 -or (Get-FileHash $base -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f34397dae9ca7986ef5d8f9183c6d4ee355126d2c9b913dea6eee561835ada74'){throw '0.16.6 baseline verification failed.'}
          Expand-Archive $base $root -Force
          foreach($d in @('storage','data','instances','runtimes')){New-Item -ItemType Directory -Force (Join-Path $root $d)|Out-Null; "KEEP-$d"|Set-Content (Join-Path $root "$d\keep.txt") -Encoding ascii}
          "WORK=$work"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ROOT=$root"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DIST=$dist"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $extract=Join-Path $work 'good-extract'; Expand-Archive $good $extract -Force
          "GOOD_HOST_HASH=$((Get-FileHash (Join-Path $extract 'SyntexLauncher.exe') -Algorithm SHA256).Hash.ToLowerInvariant())"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Setup against verified good candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @('#pragma once',("static constexpr wchar_t PAYLOAD_URL[] = L`"{0}`";" -f $env:GOOD_URL),("static constexpr wchar_t PAYLOAD_SHA256[] = L`"{0}`";" -f $env:GOOD_SHA),("static constexpr unsigned long long PAYLOAD_SIZE = {0}ULL;" -f $env:GOOD_SIZE))|Set-Content .\rc-src\PayloadContract.h -Encoding utf8
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if([string]::IsNullOrWhiteSpace($vs)){throw 'VC++ x64 tools missing.'}
          $dev=Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $setup=Join-Path $env:DIST 'SyntexSetup-0.16.7-x64.exe'
          $cmd=Join-Path $env:RUNNER_TEMP 'build-setup-diagnostic.cmd'
          @('@echo on',"call `"$dev`" -arch=x64 -host_arch=x64",'if errorlevel 1 exit /b %errorlevel%',"cl.exe /nologo /DNOMINMAX /utf-8 /std:c++20 /EHsc /W4 /O2 /MT /I`"$env:GITHUB_WORKSPACE\rc-src`" `"$env:GITHUB_WORKSPACE\rc-src\Setup.cpp`" /Fe:`"$setup`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 winhttp.lib bcrypt.lib shell32.lib ole32.lib user32.lib gdi32.lib advapi32.lib comctl32.lib uxtheme.lib",'exit /b %errorlevel%')|Set-Content $cmd -Encoding ascii
          & cmd.exe /d /c $cmd
          if($LASTEXITCODE -ne 0){throw "Setup build failed: $LASTEXITCODE"}
          "SETUP=$setup"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run real repair and always print setup/startup logs
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $p=Start-Process $env:SETUP -ArgumentList @('--ci-install',"`"$env:ROOT`"") -PassThru -Wait
          $code=$p.ExitCode
          Write-Host "SETUP_EXIT_CODE=$code"
          $setupLog=Join-Path $env:DIST 'SyntexSetup-Log'
          if(Test-Path $setupLog){Get-ChildItem $setupLog -Recurse -File|ForEach-Object{Write-Host "--- SETUP LOG $($_.FullName) ---";Get-Content $_.FullName -Raw}}
          $startup=Join-Path $env:ROOT 'storage\logs\launcher-startup'
          if(Test-Path $startup){Get-ChildItem $startup -Recurse -File|ForEach-Object{Write-Host "--- STARTUP LOG $($_.FullName) ---";Get-Content $_.FullName -Raw}}
          $update=Join-Path $env:ROOT 'storage\logs\launcher-update'
          if(Test-Path $update){Get-ChildItem $update -Recurse -File|ForEach-Object{Write-Host "--- UPDATE LOG $($_.FullName) ---";Get-Content $_.FullName -Raw}}
          foreach($d in @('storage','data','instances','runtimes')){if(Test-Path (Join-Path $env:ROOT "$d\keep.txt")){Write-Host "$d=$((Get-Content (Join-Path $env:ROOT "$d\keep.txt") -Raw).Trim())"}else{Write-Host "$d=MISSING"}}
          if(Test-Path (Join-Path $env:ROOT 'SyntexLauncher.exe')){Write-Host "HOST_SHA=$((Get-FileHash (Join-Path $env:ROOT 'SyntexLauncher.exe') -Algorithm SHA256).Hash.ToLowerInvariant())"}
          if($code -ne 0){exit $code}
          if((Get-FileHash (Join-Path $env:ROOT 'SyntexLauncher.exe') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:GOOD_HOST_HASH){throw 'Setup installed wrong host.'}
          foreach($d in @('storage','data','instances','runtimes')){if((Get-Content (Join-Path $env:ROOT "$d\keep.txt") -Raw).Trim() -ne "KEEP-$d"){throw "Setup changed $d user data."}}
          Write-Host 'SETUP_POSITIVE_DIAGNOSTIC_PASS'
