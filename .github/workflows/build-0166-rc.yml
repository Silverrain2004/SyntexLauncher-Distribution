name: Build Syntex 0.16.6 Repair RC

on:
  push:
    paths:
      - 'rc-src/**'
      - '.github/workflows/build-0166-rc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare compact payload from verified 0.16.5 application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'syntex-0166-rc'
          $old = Join-Path $work 'old'
          $payload = Join-Path $work 'payload'
          New-Item -ItemType Directory -Force -Path $old, $payload, (Join-Path $payload 'app') | Out-Null

          $baseUrl = 'https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.5/SyntexLauncher-0.16.5-win-x64.zip'
          $baseZip = Join-Path $work 'base-0.16.5.zip'
          Invoke-WebRequest -Uri $baseUrl -OutFile $baseZip -UseBasicParsing
          $baseHash = (Get-FileHash $baseZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($baseHash -ne 'a219a352bdbdc19ad0464de77214fadb6fc219e1a883fee8dfa88e3ba5078570') {
            throw "Base 0.16.5 payload hash mismatch: $baseHash"
          }
          Expand-Archive -LiteralPath $baseZip -DestinationPath $old -Force
          if (-not (Test-Path (Join-Path $old 'SyntexLauncher.exe') -PathType Leaf)) { throw 'Base launcher executable missing.' }

          Get-ChildItem -LiteralPath $old -Force | ForEach-Object {
            Move-Item -LiteralPath $_.FullName -Destination (Join-Path $payload 'app') -Force
          }
          Get-ChildItem -LiteralPath (Join-Path $payload 'app') -Recurse -Filter '*.pdb' -File | Remove-Item -Force
          Copy-Item (Join-Path $payload 'app\SyntexLauncher.exe') (Join-Path $payload 'app\SyntexLauncher.App.exe') -Force
          "RC_WORK=$work" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RC_PAYLOAD=$payload" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate Visual C++ x64 tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found.' }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vs)) { throw 'Visual C++ x64 tools not found.' }
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $dev)) { throw "VsDevCmd missing: $dev" }
          "VSDEVCMD=$dev" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build native x64 launcher host and uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmd = Join-Path $env:RUNNER_TEMP 'build-native-rc.cmd'
          @(
            '@echo on',
            "call `"$env:VSDEVCMD`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            "cl.exe /nologo /utf-8 /std:c++20 /EHsc /W4 /O1 /Os /GL /MT /DUNICODE /D_UNICODE `"$pwd\rc-src\LauncherHost.cpp`" /Fe:`"$env:RC_PAYLOAD\SyntexLauncher.exe`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF shell32.lib user32.lib",
            'if errorlevel 1 exit /b %errorlevel%',
            "cl.exe /nologo /utf-8 /std:c++20 /EHsc /W4 /O1 /Os /GL /MT /DUNICODE /D_UNICODE `"$pwd\rc-src\Uninstaller.cpp`" /Fe:`"$env:RC_PAYLOAD\app\SyntexUninstall.exe`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF shell32.lib user32.lib advapi32.lib",
            'exit /b %errorlevel%'
          ) | Set-Content -LiteralPath $cmd -Encoding ascii
          & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Native host/uninstaller build failed: $LASTEXITCODE" }

      - name: Verify compact layout and real managed GUI startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rootFiles = @(Get-ChildItem -LiteralPath $env:RC_PAYLOAD -File)
          $rootDirs = @(Get-ChildItem -LiteralPath $env:RC_PAYLOAD -Directory)
          if ($rootFiles.Count -ne 1 -or $rootFiles[0].Name -ne 'SyntexLauncher.exe') { throw "Unexpected root files: $($rootFiles.Name -join ', ')" }
          if ($rootDirs.Count -ne 1 -or $rootDirs[0].Name -ne 'app') { throw "Unexpected root dirs before first start: $($rootDirs.Name -join ', ')" }
          foreach ($required in @('app\SyntexLauncher.exe','app\SyntexLauncher.App.exe','app\SyntexUninstall.exe')) {
            if (-not (Test-Path (Join-Path $env:RC_PAYLOAD $required) -PathType Leaf)) { throw "Missing $required" }
          }

          $logTest = Start-Process -FilePath (Join-Path $env:RC_PAYLOAD 'SyntexLauncher.exe') -ArgumentList '--host-log-self-test' -PassThru -Wait
          if ($logTest.ExitCode -ne 0) { throw "Native startup log self-test failed: $($logTest.ExitCode)" }
          $startupLogs = @(Get-ChildItem -LiteralPath (Join-Path $env:RC_PAYLOAD 'storage\logs\launcher-startup') -Filter '*.log' -File)
          if ($startupLogs.Count -lt 1) { throw 'Startup host did not create its pre-.NET log.' }

          $gui = Start-Process -FilePath (Join-Path $env:RC_PAYLOAD 'SyntexLauncher.exe') -ArgumentList '--ci-gui-self-test' -PassThru -Wait
          if ($gui.ExitCode -ne 0) {
            Get-ChildItem -LiteralPath (Join-Path $env:RC_PAYLOAD 'storage\logs\launcher-startup') -File | ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -Raw }
            $managedFatal = Join-Path $env:RC_PAYLOAD 'app\diagnostics\bootstrap-fatal.log'
            if (Test-Path $managedFatal) { Write-Host '--- managed bootstrap-fatal.log ---'; Get-Content $managedFatal -Raw }
            throw "Real managed GUI startup failed: $($gui.ExitCode)"
          }
          Write-Host 'REAL MANAGED GUI STARTUP PASS.'
          Remove-Item (Join-Path $env:RC_PAYLOAD 'storage') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Create maximum-compression 0.16.6 RC payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RC_WORK 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $zip = Join-Path $dist 'SyntexLauncher-0.16.6-rc1-win-x64.zip'
          Push-Location $env:RC_PAYLOAD
          try { & 7z a -tzip -mx=9 -mfb=258 -mpass=15 -y $zip '.\*' | Out-Host } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw "7z failed: $LASTEXITCODE" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $zip).Length
          if ($size -le 0) { throw 'Payload is empty.' }
          "RC_ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RC_ZIP_HASH=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RC_ZIP_SIZE=$size" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "RC payload: $size bytes · SHA256 $hash"

      - name: Generate verified payload contract and build Setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payloadUrl = 'https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.6-rc1/SyntexLauncher-0.16.6-rc1-win-x64.zip'
          @"
          #pragma once
          #define PAYLOAD_URL L"$payloadUrl"
          #define PAYLOAD_SHA256 L"$env:RC_ZIP_HASH"
          #define PAYLOAD_SIZE $($env:RC_ZIP_SIZE)ULL
          "@ | Set-Content -LiteralPath '.\rc-src\PayloadContract.h' -Encoding utf8

          $setup = Join-Path $env:RC_WORK 'dist\SyntexLauncherSetup-0.16.6-rc1-win-x64.exe'
          $cmd = Join-Path $env:RUNNER_TEMP 'build-setup-rc.cmd'
          @(
            '@echo on',
            "call `"$env:VSDEVCMD`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            "cl.exe /nologo /utf-8 /std:c++20 /EHsc /W4 /O1 /Os /GL /MT /DUNICODE /D_UNICODE /I`"$pwd\rc-src`" `"$pwd\rc-src\Setup.cpp`" /Fe:`"$setup`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF winhttp.lib bcrypt.lib shell32.lib ole32.lib user32.lib gdi32.lib advapi32.lib comctl32.lib uxtheme.lib",
            'exit /b %errorlevel%'
          ) | Set-Content -LiteralPath $cmd -Encoding ascii
          & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Setup build failed: $LASTEXITCODE" }
          if (-not (Test-Path $setup)) { throw 'Setup output missing.' }
          if ((Get-Item $setup).Length -gt 5MB) { throw "Setup exceeds 5 MiB: $((Get-Item $setup).Length)" }
          "RC_SETUP=$setup" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run setup self-tests, repair migration test, and GUI smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($arg in @('--self-test','--log-self-test','--repair-self-test')) {
            $p = Start-Process -FilePath $env:RC_SETUP -ArgumentList $arg -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "Setup self-test $arg failed: $($p.ExitCode)" }
          }
          $p = Start-Process -FilePath $env:RC_SETUP -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 100
              $p.Refresh()
              if ($p.HasExited) { throw "Setup exited before opening GUI: $($p.ExitCode)" }
            } while ($p.MainWindowHandle -eq [IntPtr]::Zero -and [DateTime]::UtcNow -lt $deadline)
            if ($p.MainWindowHandle -eq [IntPtr]::Zero) { throw 'Setup did not open a native GUI.' }
            Write-Host "SETUP GUI PASS · HWND $($p.MainWindowHandle)"
          } finally { if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } }

      - name: Publish isolated RC release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v0.16.6-rc1 *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete v0.16.6-rc1 --cleanup-tag -y }
          gh release create v0.16.6-rc1 $env:RC_ZIP $env:RC_SETUP --prerelease --title 'Syntex Launcher 0.16.6 RC1' --notes 'Repair candidate: compact root, Unicode setup, blue progress bar, startup guardian/logging, Windows uninstall entry and in-place repair.'
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed: $LASTEXITCODE" }

      - name: Full public download-install-launch E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Sleep -Seconds 5
          $target = Join-Path $env:RUNNER_TEMP 'Syntex-0166-RC-E2E'
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $env:RC_SETUP -ArgumentList @('--ci-install', $target) -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            $logDir = Join-Path (Split-Path $env:RC_SETUP -Parent) 'SyntexSetup-Log'
            if (Test-Path $logDir) { Get-ChildItem $logDir -File | ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -Raw } }
            throw "FULL PUBLIC INSTALL E2E FAILED: $($p.ExitCode)"
          }
          Write-Host 'FULL PUBLIC DOWNLOAD + INSTALL + MANAGED GUI STARTUP PASS.'

      - name: Verify AMD64 PE and publish artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-X64([string]$Path) {
            $bytes = [IO.File]::ReadAllBytes($Path)
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "$Path is not PE." }
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            if ($machine -ne 0x8664) { throw "$Path is not AMD64: 0x$('{0:X4}' -f $machine)" }
          }
          Assert-X64 $env:RC_SETUP
          Assert-X64 (Join-Path $env:RC_PAYLOAD 'SyntexLauncher.exe')
          Assert-X64 (Join-Path $env:RC_PAYLOAD 'app\SyntexUninstall.exe')
          $setupHash = (Get-FileHash $env:RC_SETUP -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSize = (Get-Item $env:RC_SETUP).Length
          @"
          version=0.16.6-rc1
          setup_size=$setupSize
          setup_sha256=$setupHash
          payload_size=$env:RC_ZIP_SIZE
          payload_sha256=$env:RC_ZIP_HASH
          "@ | Set-Content (Join-Path $env:RC_WORK 'dist\SHA256SUMS.txt') -Encoding ascii
          Write-Host "FINAL SETUP · $setupSize bytes · SHA256 $setupHash"

      - uses: actions/upload-artifact@v4
        with:
          name: SyntexLauncherSetup-0.16.6-rc1-win-x64
          path: |
            ${{ env.RC_SETUP }}
            ${{ env.RC_WORK }}\dist\SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
