name: Syntex 0.16.7 Patched Managed Window E2E

on:
  workflow_dispatch:
  push:
    branches: ['feat/0.16.7-self-update']
    paths:
      - 'rc-src/PatchManagedStartup.cs'
      - 'rc-src/LauncherHost.cpp'
      - '.github/workflows/0167-patched-managed-window-e2e.yml'

permissions:
  contents: read

jobs:
  windows-patched-managed-window:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/0.16.7-self-update

      - name: Prepare immutable published 0.16.6 payload copy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'syntex-patched-window'
          $zip=Join-Path $env:RUNNER_TEMP 'base-0.16.6.zip'
          Invoke-WebRequest -Uri 'https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.6/SyntexLauncher-0.16.6-win-x64.zip' -OutFile $zip -UseBasicParsing
          if((Get-Item $zip).Length -ne 69903997){throw 'Published 0.16.6 payload size changed.'}
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne 'f34397dae9ca7986ef5d8f9183c6d4ee355126d2c9b913dea6eee561835ada74'){throw "Published 0.16.6 payload hash changed: $sha"}
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $managed=Join-Path $root 'app\SyntexLauncher.App.dll'
          if(-not (Test-Path $managed)){
            throw "Expected managed launcher assembly missing: $managed"
          }
          "ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MANAGED=$managed" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Patch managed startup in temporary candidate only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $patchDir=Join-Path $env:RUNNER_TEMP 'managed-startup-patcher'
          New-Item -ItemType Directory -Force -Path $patchDir | Out-Null
          Copy-Item .\rc-src\PatchManagedStartup.cs (Join-Path $patchDir 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Mono.Cecil" Version="0.11.6" />
            </ItemGroup>
          </Project>
          '@ | Set-Content (Join-Path $patchDir 'Patcher.csproj') -Encoding utf8
          dotnet run --project (Join-Path $patchDir 'Patcher.csproj') -c Release -- $env:MANAGED
          if($LASTEXITCODE -ne 0){throw "Managed startup patch failed: $LASTEXITCODE"}
          if(-not (Test-Path $env:MANAGED)){throw 'Patched managed assembly missing.'}
          $sha=(Get-FileHash $env:MANAGED -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "PATCHED_MANAGED_SHA256=$sha"

      - name: Build current 0.16.7 x64 LauncherHost
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if([string]::IsNullOrWhiteSpace($vs)){throw 'Visual C++ x64 tools not found.'}
          $dev=Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $cmd=Join-Path $env:RUNNER_TEMP 'build-host.cmd'
          @('@echo on',"call `"$dev`" -arch=x64 -host_arch=x64",'if errorlevel 1 exit /b %errorlevel%',"cl.exe /nologo /DNOMINMAX /utf-8 /std:c++20 /EHsc /W4 /O1 /Os /GL /MT `"$env:GITHUB_WORKSPACE\rc-src\LauncherHost.cpp`" /Fe:`"$env:ROOT\SyntexLauncher.exe`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF winhttp.lib bcrypt.lib shell32.lib user32.lib",'exit /b %errorlevel%') | Set-Content $cmd -Encoding ascii
          & cmd.exe /d /c $cmd
          if($LASTEXITCODE -ne 0){throw "LauncherHost build failed: $LASTEXITCODE"}

      - name: Require a genuine visible managed launcher window
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $host=Join-Path $env:ROOT 'SyntexLauncher.exe'
          $p=Start-Process $host -ArgumentList '--ci-gui-self-test' -PassThru
          if(-not $p.WaitForExit(45000)){
            try{$p.Kill($true)}catch{}
            Get-Process SyntexLauncher -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            throw 'Patched managed launcher did not satisfy visible-window healthcheck in 45 seconds.'
          }
          if($p.ExitCode -ne 0){
            $logRoot=Join-Path $env:ROOT 'storage\logs\launcher-startup'
            if(Test-Path $logRoot){Get-ChildItem $logRoot -File | ForEach-Object {Get-Content $_.FullName -Raw | Write-Host}}
            throw "Patched managed launcher visible-window healthcheck failed: $($p.ExitCode)"
          }
          $logs=Join-Path $env:ROOT 'storage\logs\launcher-startup'
          $text=(Get-ChildItem $logs -File | ForEach-Object {Get-Content $_.FullName -Raw}) -join "`n"
          if($text -notmatch 'Startprüfung erfolgreich: sichtbares Launcher-Fenster erkannt'){throw 'Visible-window success evidence missing.'}
          Get-Process SyntexLauncher -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'PATCHED_MANAGED_REAL_VISIBLE_WINDOW_PASS'
