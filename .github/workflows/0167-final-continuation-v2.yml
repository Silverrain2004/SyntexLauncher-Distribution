name: Syntex 0.16.7 Final Continuation V2

on:
  workflow_dispatch:
  push:
    branches: ['feat/0.16.7-self-update']
    paths:
      - '.github/workflows/0167-final-continuation-v2.yml'

permissions:
  contents: read

jobs:
  windows-final:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GOOD_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.7-ci-34467708548/SyntexLauncher-0.16.7-ci-win-x64.zip
      GOOD_SHA: cc716db79bc5eb8cae80413aa2fe5cce519e05e3c2b12b9e11ae943c1780207f
      GOOD_SIZE: 70090490
      BAD_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.7-ci-bad-34467708548/SyntexLauncher-0.16.7-ci-bad-win-x64.zip
      BAD_SHA: bf0ec4a9cb0dfe23b8299b0c67269a71c01a2e9819c72af2c03ae8cb686a096a
      BAD_SIZE: 70087569
      BASE_URL: https://github.com/Silverrain2004/SyntexLauncher-Distribution/releases/download/v0.16.6/SyntexLauncher-0.16.6-win-x64.zip
      BASE_SHA: f34397dae9ca7986ef5d8f9183c6d4ee355126d2c9b913dea6eee561835ada74
      BASE_SIZE: 69903997

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/0.16.7-self-update

      - name: Verify source contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=Get-Content .\rc-src\Setup.cpp -Raw
          foreach($needle in @('PROGRESS_CLASSW','PBM_SETPOS','SyntexSetup-Log','Installationsordner','Reparatur/Aktualisierung abgeschlossen.')){if(-not $setup.Contains($needle)){throw "Setup source contract missing: $needle"}}
          if(-not $setup.Contains('Durchsuchen…')){throw 'Unicode German setup text missing.'}
          $repair=Get-Content .\rc-src\RepairTransaction.h -Raw
          foreach($needle in @('L"storage"','RemovePackagedPersistentEntries','L"data"','L"instances"','L"runtimes"')){if(-not $repair.Contains($needle)){throw "Persistent-data contract missing: $needle"}}

      - name: Prepare immutable inputs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $work=Join-Path $env:RUNNER_TEMP 'syntex-final-v2'; $dist=Join-Path $work 'dist'
          New-Item -ItemType Directory -Force -Path $work,$dist|Out-Null
          function Get-Verified($url,$sha,$size,$name){
            $p=Join-Path $env:RUNNER_TEMP $name; Invoke-WebRequest $url -OutFile $p -UseBasicParsing
            if((Get-Item $p).Length -ne [int64]$size){throw "$name size mismatch"}
            if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha){throw "$name hash mismatch"}
            return $p
          }
          $base=Get-Verified $env:BASE_URL $env:BASE_SHA $env:BASE_SIZE 'syntex-base-0166.zip'
          $good=Get-Verified $env:GOOD_URL $env:GOOD_SHA $env:GOOD_SIZE 'syntex-good-0167.zip'
          $bad=Get-Verified $env:BAD_URL $env:BAD_SHA $env:BAD_SIZE 'syntex-bad-0167.zip'
          $extract=Join-Path $work 'good-extract'; Expand-Archive $good $extract -Force
          "WORK=$work"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DIST=$dist"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BASE_ZIP=$base"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GOOD_HOST_HASH=$((Get-FileHash (Join-Path $extract 'SyntexLauncher.exe') -Algorithm SHA256).Hash.ToLowerInvariant())"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate Visual C++ x64 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if([string]::IsNullOrWhiteSpace($vs)){throw 'Visual C++ x64 tools missing.'}
          "VSDEVCMD=$(Join-Path $vs 'Common7\Tools\VsDevCmd.bat')"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Real self-update 0.16.6 to verified 0.16.7 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:WORK 'update-root'; Expand-Archive $env:BASE_ZIP $root -Force
          foreach($d in @('storage','data','instances','runtimes')){New-Item -ItemType Directory -Force (Join-Path $root $d)|Out-Null; "KEEP-$d"|Set-Content (Join-Path $root "$d\keep.txt") -Encoding ascii}
          $src=Get-Content .\rc-src\LauncherHost.cpp -Raw
          $src=$src.Replace('static constexpr wchar_t kCurrentVersion[] = L"0.16.7";','static constexpr wchar_t kCurrentVersion[] = L"0.16.6";')
          $src=$src.Replace('https://raw.githubusercontent.com/Silverrain2004/SyntexLauncher-Distribution/main/distribution.json','https://raw.githubusercontent.com/Silverrain2004/SyntexLauncher-Distribution/feat/0.16.7-self-update/self-update-final-gate.json')
          $old=Join-Path $env:RUNNER_TEMP 'LauncherHost-v2-old.cpp'; Set-Content $old $src -Encoding utf8
          $cmd=Join-Path $env:RUNNER_TEMP 'build-v2-old.cmd'
          @('@echo on',"call `"$env:VSDEVCMD`" -arch=x64 -host_arch=x64",'if errorlevel 1 exit /b %errorlevel%',"cl.exe /nologo /DNOMINMAX /utf-8 /std:c++20 /EHsc /W4 /O1 /Os /GL /MT `"$old`" /Fe:`"$root\SyntexLauncher.exe`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF winhttp.lib bcrypt.lib shell32.lib user32.lib",'exit /b %errorlevel%')|Set-Content $cmd -Encoding ascii
          & cmd.exe /d /c $cmd; if($LASTEXITCODE -ne 0){throw 'Old host build failed.'}
          $p=Start-Process (Join-Path $root 'SyntexLauncher.exe') -PassThru
          if(-not $p.WaitForExit(45000)){try{$p.Kill($true)}catch{};throw 'Original 0.16.6 host did not hand off update.'}
          if($p.ExitCode -ne 0){throw "Original host exit $($p.ExitCode)"}
          $deadline=[DateTime]::UtcNow.AddMinutes(3); $ok=$false
          do{Start-Sleep -Milliseconds 500;$dir=Join-Path $root 'storage\logs\launcher-update';if(Test-Path $dir){if(Get-ChildItem $dir -File|Where-Object{(Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue)-match 'UPDATE_SUCCESS'}){$ok=$true;break}}}while([DateTime]::UtcNow -lt $deadline)
          if(-not $ok){if(Test-Path (Join-Path $root 'storage\logs')){Get-ChildItem (Join-Path $root 'storage\logs') -Recurse -File|ForEach-Object{Write-Host "--- $($_.FullName) ---";Get-Content $_.FullName -Raw}};throw 'Self-update did not reach UPDATE_SUCCESS.'}
          if((Get-FileHash (Join-Path $root 'SyntexLauncher.exe') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:GOOD_HOST_HASH){throw 'Updated host hash mismatch.'}
          foreach($d in @('storage','data','instances','runtimes')){if((Get-Content (Join-Path $root "$d\keep.txt") -Raw).Trim() -ne "KEEP-$d"){throw "Self-update changed $d"}}
          Get-Process SyntexLauncher -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'FINAL_V2_SELF_UPDATE_VISIBLE_START_USER_DATA_PASS'

      - name: Build good and bad x64 Setup with inspectable CI install
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Get-Content .\rc-src\Setup.cpp -Raw
          $source2=[regex]::Replace($source,'(?ms)(if \(argv && argc == 3 && _wcsicmp\(argv\[1\], L"--ci-install"\) == 0\) \{.*?if \(!ok\) \{ WriteSetupLog\(L"CI install E2E: " \+ error\); return 5; \})\s*std::error_code ec;\s*fs::remove_all\(target, ec\);\s*return 0;','$1`r`n        return 0;',1)
          if($source2 -eq $source -or $source2.Contains('fs::remove_all(target, ec);')){throw 'Could not disable CI-only successful target cleanup for inspectable E2E build.'}
          $src=Join-Path $env:RUNNER_TEMP 'Setup-final-v2.cpp'; Set-Content $src $source2 -Encoding utf8
          function Build-Setup($url,$sha,$size,$out,$suffix){
            @('#pragma once',("static constexpr wchar_t PAYLOAD_URL[] = L`"{0}`";" -f $url),("static constexpr wchar_t PAYLOAD_SHA256[] = L`"{0}`";" -f $sha),("static constexpr unsigned long long PAYLOAD_SIZE = {0}ULL;" -f $size))|Set-Content .\rc-src\PayloadContract.h -Encoding utf8
            $cmd=Join-Path $env:RUNNER_TEMP "build-v2-setup-$suffix.cmd"
            @('@echo on',"call `"$env:VSDEVCMD`" -arch=x64 -host_arch=x64",'if errorlevel 1 exit /b %errorlevel%',"cl.exe /nologo /DNOMINMAX /utf-8 /std:c++20 /EHsc /W4 /O2 /MT /I`"$env:GITHUB_WORKSPACE\rc-src`" `"$src`" /Fe:`"$out`" /link /SUBSYSTEM:WINDOWS /MACHINE:X64 winhttp.lib bcrypt.lib shell32.lib ole32.lib user32.lib gdi32.lib advapi32.lib comctl32.lib uxtheme.lib",'exit /b %errorlevel%')|Set-Content $cmd -Encoding ascii
            & cmd.exe /d /c $cmd; if($LASTEXITCODE -ne 0){throw "Setup $suffix build failed."}
          }
          $good=Join-Path $env:DIST 'SyntexSetup-0.16.7-x64.exe';$bad=Join-Path $env:DIST 'SyntexSetup-0.16.7-x64-rollback-test.exe'
          Build-Setup $env:GOOD_URL $env:GOOD_SHA $env:GOOD_SIZE $good 'good'
          Build-Setup $env:BAD_URL $env:BAD_SHA $env:BAD_SIZE $bad 'bad'
          "FINAL_SETUP=$good"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BAD_SETUP=$bad"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup contract selftests and log location
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($arg in @('--self-test','--repair-self-test','--log-self-test')){$p=Start-Process $env:FINAL_SETUP -ArgumentList $arg -PassThru -Wait;if($p.ExitCode -ne 0){throw "$arg failed: $($p.ExitCode)"}}
          $logDir=Join-Path $env:DIST 'SyntexSetup-Log';if(-not (Test-Path $logDir)){throw 'SyntexSetup-Log was not created next to setup.'}
          if(-not (Get-ChildItem $logDir -File)){throw 'Setup log selftest produced no log.'}

      - name: Real positive Setup repair visible window and preserve all user roots
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:WORK 'setup-good-root';Expand-Archive $env:BASE_ZIP $root -Force
          foreach($d in @('storage','data','instances','runtimes')){New-Item -ItemType Directory -Force (Join-Path $root $d)|Out-Null;"KEEP-$d"|Set-Content (Join-Path $root "$d\keep.txt") -Encoding ascii}
          $p=Start-Process $env:FINAL_SETUP -ArgumentList @('--ci-install',"`"$root`"") -PassThru -Wait
          if($p.ExitCode -ne 0){$setupLogs=Join-Path $env:DIST 'SyntexSetup-Log';if(Test-Path $setupLogs){Get-ChildItem $setupLogs -File|ForEach-Object{Write-Host "--- $($_.FullName) ---";Get-Content $_.FullName -Raw}};$startup=Join-Path $root 'storage\logs\launcher-startup';if(Test-Path $startup){Get-ChildItem $startup -File|ForEach-Object{Write-Host "--- $($_.FullName) ---";Get-Content $_.FullName -Raw}};throw "Good Setup exit $($p.ExitCode)"}
          if((Get-FileHash (Join-Path $root 'SyntexLauncher.exe') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:GOOD_HOST_HASH){throw 'Setup installed wrong host.'}
          foreach($d in @('storage','data','instances','runtimes')){if((Get-Content (Join-Path $root "$d\keep.txt") -Raw).Trim() -ne "KEEP-$d"){throw "Setup changed $d"}}
          Get-Process SyntexLauncher -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'FINAL_V2_SETUP_REPAIR_VISIBLE_START_USER_DATA_PASS'

      - name: Real Setup automatic rollback and preserve all user roots
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:WORK 'setup-bad-root';Expand-Archive $env:BASE_ZIP $root -Force
          foreach($d in @('storage','data','instances','runtimes')){New-Item -ItemType Directory -Force (Join-Path $root $d)|Out-Null;"KEEP-$d"|Set-Content (Join-Path $root "$d\keep.txt") -Encoding ascii}
          $old=(Get-FileHash (Join-Path $root 'SyntexLauncher.exe') -Algorithm SHA256).Hash
          $p=Start-Process $env:BAD_SETUP -ArgumentList @('--ci-install',"`"$root`"") -PassThru -Wait
          if($p.ExitCode -eq 0){throw 'Bad Setup unexpectedly succeeded.'}
          if((Get-FileHash (Join-Path $root 'SyntexLauncher.exe') -Algorithm SHA256).Hash -ne $old){throw 'Rollback did not restore old host.'}
          foreach($d in @('storage','data','instances','runtimes')){if((Get-Content (Join-Path $root "$d\keep.txt") -Raw).Trim() -ne "KEEP-$d"){throw "Rollback changed $d"}}
          Write-Host 'FINAL_V2_SETUP_AUTOMATIC_ROLLBACK_USER_DATA_PASS'

      - name: Upload final setup only after every gate passes
        uses: actions/upload-artifact@v4
        with:
          name: SyntexSetup-0.16.7-x64-final-v2
          path: ${{ env.FINAL_SETUP }}
          if-no-files-found: error
          retention-days: 7
